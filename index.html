<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MB — Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --bg:#000;--surface:#0b0b0b;--surface2:#151515;--text:#fff;--muted:#999;
 --line:#2a2a2a;--primary:#fff;--primary2:#ddd;--danger:#fff;--ok:#fff;
 --shadow:0 12px 40px rgba(0,0,0,.28);--radius:18px;
}
[data-theme=light]{--bg:#fff;--surface:#fafafa;--surface2:#f0f0f0;--text:#000;--muted:#666;--line:#d8d8d8;--shadow:0 12px 35px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.app{height:100dvh;display:grid;grid-template-columns:250px minmax(0,680px) 290px;max-width:1400px;margin:auto;background:var(--bg)}
.sidebar,.rightbar{padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
.rightbar{border-right:0;border-left:1px solid var(--line)}
.brand{font-size:24px;font-weight:900;letter-spacing:-1px;margin:4px 10px 28px}
.brand span{color:var(--text)}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:13px 14px;border-radius:13px;text-align:left;font-weight:700;font-size:15px}
.nav button:hover,.nav button.active{background:var(--surface2);color:var(--text)}
.nav button.active{color:var(--text);font-weight:900}
.side-profile{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#222;display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.sm{width:34px;height:34px}.avatar.lg{width:86px;height:86px;font-size:30px}
.main{min-width:0;overflow-y:auto;border-right:1px solid var(--line)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.top h2{font-size:18px}.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--text);width:38px;height:38px;border-radius:50%}
.content{padding:16px}.view{display:none}.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
.composer{padding:14px}.composer-row{display:flex;gap:10px}.composer textarea{flex:1;resize:none;min-height:58px;max-height:150px;border:0;background:var(--surface2);color:var(--text);border-radius:15px;padding:13px;outline:0}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.action-links{display:flex;gap:4px}.mini{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:10px}.mini:hover{background:var(--surface2);color:var(--text)}
.btn{border:1px solid var(--text);border-radius:12px;background:var(--primary);color:var(--bg);padding:10px 15px;font-weight:750}.btn:hover{opacity:.82}.btn.outline{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--text);color:var(--bg)}
.post{overflow:hidden}.post-head{display:flex;gap:10px;align-items:center;padding:14px}.post-author{font-weight:800}.post-time{font-size:11px;color:var(--muted)}.post-menu{margin-left:auto}.post-body{padding:0 14px 12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.post-image{width:100%;max-height:560px;object-fit:cover;display:block}.post-stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:9px 14px;border-top:1px solid var(--line)}.post-actions{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.post-actions button{border:0;background:transparent;color:var(--muted);padding:11px}.post-actions button:hover,.post-actions button.liked{color:var(--text);background:var(--surface2);font-weight:800}
.input{width:100%;padding:12px 14px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:13px;outline:0}.input:focus{border-color:var(--text)}
.search{display:flex;gap:8px;margin-bottom:14px}.search .input{flex:1}
.user{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid var(--line)}.user:last-child{border-bottom:0}.user-main{min-width:0;flex:1}.user-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:var(--muted);font-size:12px}
.right-title{font-weight:850;margin:3px 8px 12px}.trend{padding:12px;border-bottom:1px solid var(--line)}.trend small{color:var(--muted)}.trend b{display:block;margin:4px 0}
.profile-cover{height:125px;background:linear-gradient(120deg,#111,#333,#000);border-radius:18px 18px 0 0}.profile-main{padding:0 18px 18px}.profile-main .avatar{margin-top:-43px;border:4px solid var(--surface)}.profile-name{font-size:22px;font-weight:900;margin-top:8px}.bio{color:var(--muted);margin:5px 0 14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;padding:16px}.modal{width:min(500px,100%);max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.auth{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#222,var(--bg) 45%);display:grid;place-items:center;padding:18px;z-index:200}.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.auth-logo{font-size:34px;font-weight:950;margin-bottom:8px}.auth-logo span{color:var(--primary)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--surface2);padding:4px;border-radius:12px;margin:20px 0}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px}.tabs button.active{background:var(--surface);color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:300}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chat{height:calc(100dvh - 70px);display:flex;flex-direction:column}.chat-list{overflow:auto}.chat-window{flex:1;display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:15px;background:var(--bg)}.bubble{max-width:78%;padding:9px 12px;border-radius:16px;margin:5px 0;line-height:1.4;word-break:break-word}.mine{margin-left:auto;background:var(--primary);color:#fff;border-bottom-right-radius:4px}.theirs{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}.status-dot{width:7px;height:7px;border-radius:50%;background:#fff;border:1px solid #000;display:inline-block}.status-dot.offline{background:#555;border-color:#777}.profile-stats{display:flex;gap:22px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0}.profile-stats b{display:block;font-size:18px}.profile-stats span{font-size:11px;color:var(--muted)}.comment-list{max-height:48vh;overflow:auto}.comment{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.comment:last-child{border-bottom:0}.comment-body{flex:1}.comment-form{display:flex;gap:8px;margin-top:12px;position:sticky;bottom:0;background:var(--surface);padding-top:10px}
@media(max-width:1050px){.app{grid-template-columns:74px minmax(0,680px)}.sidebar{padding:18px 9px}.brand{font-size:0;text-align:center}.brand span{font-size:23px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:21px}.side-profile{display:none}.rightbar{display:none}}
@media(max-width:700px){body{background:var(--surface)}.app{display:block;max-width:none}.sidebar{position:fixed;bottom:0;left:0;right:0;height:65px;z-index:30;border:0;border-top:1px solid var(--line);padding:5px 4px}.brand{display:none}.nav{display:grid;grid-template-columns:repeat(5,1fr);height:100%}.nav button{font-size:10px;padding:6px 2px;text-align:center}.main{height:100dvh;border:0;padding-bottom:65px}.content{padding:10px}.top{padding:11px 13px}.card{border-radius:15px}.post{margin-bottom:10px}.composer{padding:10px}.auth-card{padding:22px}}
</style>
</head>
<body>
<div id="auth" class="auth">
 <div class="auth-card">
  <div class="auth-logo">MB<span>.</span></div><div class="muted">Социальная сеть нового поколения</div>
  <div class="tabs"><button id="loginTab" class="active" onclick="authTab('login')">Войти</button><button id="regTab" onclick="authTab('reg')">Создать аккаунт</button></div>
  <div id="loginForm"><input id="loginEmail" class="input" placeholder="Email"><input id="loginPass" class="input" style="margin-top:9px" type="password" placeholder="Пароль"><button class="btn" style="width:100%;margin-top:12px" onclick="login()">Войти</button></div>
  <div id="regForm" class="hidden"><input id="regName" class="input" placeholder="Имя / ник"><input id="regEmail" class="input" style="margin-top:9px" placeholder="Email"><input id="regPass" class="input" style="margin-top:9px" type="password" placeholder="Пароль (6+)"><button class="btn" style="width:100%;margin-top:12px" onclick="register()">Создать аккаунт</button></div>
 </div>
</div>

<div id="app" class="app hidden">
 <aside class="sidebar">
  <div class="brand">MB<span>.</span></div>
  <nav class="nav">
   <button class="active" data-view="home" onclick="go('home')">⌂ Лента</button>
   <button data-view="search" onclick="go('search')">⌕ Поиск</button>
   <button data-view="messages" onclick="go('messages')">✉ Чаты</button>
   <button data-view="friends" onclick="go('friends')">♙ Друзья</button>
   <button data-view="profile" onclick="go('profile')">● Профиль</button>
  </nav>
  <div class="side-profile"><div id="sideAvatar" class="avatar sm">?</div><div style="min-width:0"><b id="sideName">---</b><div class="muted">@<span id="sideUsername">---</span></div></div></div>
 </aside>

 <main class="main">
  <header class="top"><h2 id="title">Главная</h2><button class="iconbtn" onclick="openSettings()">⚙</button></header>
  <div class="content">
   <section id="view-home" class="view active">
    <div class="card composer"><div class="composer-row"><div id="composerAvatar" class="avatar sm">?</div><textarea id="postText" placeholder="Что нового?"></textarea></div><div class="actions"><div class="action-links"><button class="mini" onclick="pickImage()">▣ Фото</button></div><button class="btn" onclick="createPost()">Опубликовать</button></div><input id="postImage" class="hidden" type="file" accept="image/*" onchange="previewImage(this)"><div id="imagePreview" class="hidden" style="margin-top:10px"></div></div>
    <div id="feed"></div>
   </section>

   <section id="view-search" class="view">
    <div class="search"><input id="searchInput" class="input" placeholder="Имя или @username" onkeydown="if(event.key==='Enter')searchUsers()"><button class="btn" onclick="searchUsers()">Найти</button></div><div id="searchResults" class="card"></div>
   </section>

   <section id="view-friends" class="view">
    <div class="card"><div style="padding:14px;font-weight:850">Заявки</div><div id="requests"></div></div>
    <div class="card"><div style="padding:14px;font-weight:850">Друзья</div><div id="friends"></div></div>
   </section>

   <section id="view-messages" class="view">
    <div id="chatList" class="card chat-list"></div>
    <div id="chatWindow" class="chat-window hidden"><div style="padding:10px 0"><button class="btn outline" onclick="closeChat()">← Назад</button> <b id="chatName"></b><div id="chatStatus" style="margin-left:8px;display:inline-block"></div></div><div id="messages" class="messages card"></div><div class="chat-input"><input id="messageInput" class="input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn" onclick="sendMessage()">➤</button></div></div>
   </section>

   <section id="view-profile" class="view">
    <div class="card" style="overflow:hidden"><div class="profile-cover"></div><div class="profile-main"><div id="profileAvatar" class="avatar lg">?</div><div id="profileName" class="profile-name">---</div><div id="profileUsername" class="muted">@---</div><div id="profileBio" class="bio">Заполните описание профиля.</div><div id="profileStatus" class="status"></div><div class="profile-stats"><div><b id="profileFriendsCount">0</b><span>Друзей</span></div><div><b id="profilePostsCount">0</b><span>Постов</span></div></div><button class="btn outline" onclick="openEditProfile()">Редактировать профиль</button></div></div>
    <div id="myPosts"></div>
   </section>
  </div>
 </main>

 <aside class="rightbar">
  <div class="right-title">В тренде</div>
  <div class="card">
   <div class="trend"><small>Социальная сеть</small><b>Добро пожаловать в MB</b><small>Общайтесь и делитесь моментами</small></div>
   <div class="trend"><small>Ваши друзья</small><b id="friendCount">0 друзей</b><small>Добавляйте людей через поиск</small></div>
  </div>
 </aside>
</div>

<div id="modal" class="modal-bg hidden"><div class="modal" id="modalBody"></div></div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://pgnmaoybgwesqctysveu.supabase.co";
const SUPABASE_KEY="sb_publishable_TSFvhqldPDdWGncB92rVag_KkdkwlZP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,profile=null,chatPartner=null,selectedImage=null,realtimeStarted=false,presenceTimer=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function avatarHTML(u,cls='avatar sm'){return `<div class="${cls}">${u?.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc((u?.full_name||u?.username||'?')[0]?.toUpperCase())}</div>`}
function time(s){try{return new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return ''}}

function authTab(t){$('loginForm').classList.toggle('hidden',t!=='login');$('regForm').classList.toggle('hidden',t!=='reg');$('loginTab').classList.toggle('active',t==='login');$('regTab').classList.toggle('active',t==='reg')}
async function login(){let email=$('loginEmail').value.trim(),password=$('loginPass').value;if(!email||!password)return toast('Заполните поля');let{error}=await db.auth.signInWithPassword({email,password});if(error)toast(error.message)}
async function register(){let username=$('regName').value.trim(),email=$('regEmail').value.trim(),password=$('regPass').value;if(!username||!email||password.length<6)return toast('Проверьте данные');let{error}=await db.auth.signUp({email,password,options:{data:{username}}});if(error)return toast(error.message);await db.auth.signInWithPassword({email,password})}
db.auth.onAuthStateChange((_,session)=>{if(session){me=session.user;showApp()}else{me=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}});

async function showApp(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadProfile();await loadFeed();startPresence();startRealtime()}
async function loadProfile(){
 let{data}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(!data){let username=me.user_metadata?.username||me.email.split('@')[0];await db.from('profiles').insert({id:me.id,username,full_name:username});data={id:me.id,username,full_name:username}}
 profile=data;
 $('sideName').textContent=data.full_name||data.username;$('sideUsername').textContent=data.username;
 $('sideAvatar').outerHTML=avatarHTML(data,'avatar sm');$('sideAvatar')?.setAttribute('id','sideAvatar');
 setAvatar('composerAvatar',data);setAvatar('profileAvatar',data);
 $('profileName').textContent=data.full_name||data.username;$('profileUsername').textContent='@'+data.username;$('profileBio').textContent=data.bio||'Заполните описание профиля.';$('profileStatus').innerHTML=statusHTML(data);await updatePresence();
}
function setAvatar(id,u){let el=$(id);if(!el)return;if(u.avatar_url)el.innerHTML=`<img src="${esc(u.avatar_url)}">`;else el.textContent=(u.full_name||u.username||'?')[0].toUpperCase()}

async function updatePresence(){if(!me)return;await db.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id)}
function startPresence(){if(presenceTimer)clearInterval(presenceTimer);updatePresence();presenceTimer=setInterval(updatePresence,30000)}

function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('view-'+v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('title').textContent={home:'Главная',search:'Поиск',friends:'Друзья',messages:'Сообщения',profile:'Профиль'}[v];if(v==='home')loadFeed();if(v==='friends')loadFriends();if(v==='messages')loadChats();if(v==='profile')loadMyPosts()}

async function loadFeed(){
 const box=$('feed');box.innerHTML='<div class="muted" style="padding:25px;text-align:center">Загрузка...</div>';
 let{data,error}=await db.from('posts').select('*,profiles!posts_user_id_fkey(id,username,full_name,avatar_url)').order('created_at',{ascending:false}).limit(50);
 if(error){box.innerHTML='<div class="card" style="padding:20px"><b>Лента ещё не подключена</b><p class="muted" style="margin-top:6px">Выполните SQL-файл, который идёт вместе с этой версией.</p></div>';return}
 box.innerHTML=data?.length?data.map(postHTML).join(''):'<div class="card" style="padding:28px;text-align:center"><b>Пока пусто</b><p class="muted" style="margin-top:6px">Опубликуйте первый пост.</p></div>';
}
function postHTML(p){
 let u=p.profiles||{};let own=p.user_id===me.id;
 return `<article class="card post" data-post="${p.id}"><div class="post-head">${avatarHTML(u)}<div style="min-width:0"><div class="post-author">${esc(u.full_name||u.username||'Пользователь')}</div><div class="post-time">@${esc(u.username||'')} · ${time(p.created_at)}</div></div>${own?`<button class="mini post-menu" onclick="deletePost('${p.id}')">Удалить</button>`:''}</div><div class="post-body">${esc(p.content||'')}</div>${p.image_url?`<img class="post-image" src="${esc(p.image_url)}">`:''}<div class="post-stats"><span id="stats-like-${p.id}">${p.likes_count||0} реакций</span><span id="stats-comment-${p.id}" onclick="openComments('${p.id}')" style="cursor:pointer">${p.comments_count||0} комментариев</span></div><div class="post-actions"><button id="like-${p.id}" onclick="likePost('${p.id}')">♡ Нравится</button><button onclick="openComments('${p.id}')">◯ Комментировать</button><button onclick="openProfile('${p.user_id}')">Профиль</button></div></article>`
}
async function createPost(){let content=$('postText').value.trim();if(!content&&!selectedImage)return toast('Добавьте текст или фото');let image_url=null;if(selectedImage){image_url=await uploadImage(selectedImage,'posts');if(!image_url)return}let{error}=await db.from('posts').insert({user_id:me.id,content,image_url});if(error)return toast(error.message);$('postText').value='';selectedImage=null;$('imagePreview').classList.add('hidden');$('postImage').value='';loadFeed()}
function pickImage(){$('postImage').click()}
function previewImage(input){selectedImage=input.files?.[0]||null;if(!selectedImage)return;let url=URL.createObjectURL(selectedImage);$('imagePreview').innerHTML=`<img src="${url}" style="max-height:180px;max-width:100%;border-radius:12px">`;$('imagePreview').classList.remove('hidden')}
async function uploadImage(file,folder){let ext=file.name.split('.').pop().toLowerCase(),path=`${folder}/${me.id}/${crypto.randomUUID()}.${ext}`;let{error}=await db.storage.from('media').upload(path,file,{upsert:false});if(error){toast('Ошибка загрузки фото: '+error.message);return null}let{data}=db.storage.from('media').getPublicUrl(path);return data.publicUrl}
async function deletePost(id){if(!confirm('Удалить этот пост?'))return;let{error}=await db.from('posts').delete().eq('id',id).eq('user_id',me.id);if(error)toast(error.message);else{toast('Пост удалён');loadFeed();loadMyPosts()}}
async function likePost(id){let{data}=await db.from('post_likes').select('id').eq('post_id',id).eq('user_id',me.id).maybeSingle();let error;if(data){({error}=await db.from('post_likes').delete().eq('id',data.id))}else{({error}=await db.from('post_likes').insert({post_id:id,user_id:me.id}))}if(error)return toast(error.message);await refreshPostCounts(id)}
async function refreshPostCounts(id){let{count}=await db.from('post_likes').select('id',{count:'exact',head:true}).eq('post_id',id);let{count:cc}=await db.from('comments').select('id',{count:'exact',head:true}).eq('post_id',id);let l=$(`stats-like-${id}`),c=$(`stats-comment-${id}`);if(l)l.textContent=(count||0)+' реакций';if(c)c.textContent=(cc||0)+' комментариев';let b=$(`like-${id}`);if(b){let{data}=await db.from('post_likes').select('id').eq('post_id',id).eq('user_id',me.id).maybeSingle();b.classList.toggle('liked',!!data);b.textContent=data?'♥ Нравится':'♡ Нравится'}}
async function openComments(id){let{data,error}=await db.from('comments').select('*,profiles!comments_user_id_fkey(id,username,full_name,avatar_url)').eq('post_id',id).order('created_at',{ascending:true});if(error)return toast(error.message);$('modalBody').innerHTML=`<div class="modal-head"><b>Комментарии</b><button class="iconbtn" onclick="closeModal()">×</button></div><div id="commentList" class="comment-list">${data?.length?data.map(commentHTML).join(''):'<div class="muted" style="padding:15px 0;text-align:center">Комментариев пока нет.</div>'}</div><div class="comment-form"><input id="commentInput" class="input" placeholder="Написать комментарий..." onkeydown="if(event.key==='Enter')addComment('${id}')"><button class="btn" onclick="addComment('${id}')">Отправить</button></div>`;$('modal').classList.remove('hidden')}
function commentHTML(c){let u=c.profiles||{};return `<div class="comment">${avatarHTML(u,'avatar sm')}<div class="comment-body"><b>${esc(u.full_name||u.username)}</b><div class="muted">@${esc(u.username)} · ${time(c.created_at)}</div><div style="margin-top:4px;white-space:pre-wrap">${esc(c.content)}</div></div></div>`}
async function addComment(id){let input=$('commentInput'),text=input?.value.trim();if(!text)return;let{error}=await db.from('comments').insert({post_id:id,user_id:me.id,content:text});if(error)return toast(error.message);input.value='';await refreshPostCounts(id);openComments(id)}
async function sharePost(id){let url=location.href.split('#')[0]+'#post-'+id;if(navigator.share)try{await navigator.share({title:'MB',text:'Посмотри этот пост',url})}catch{}else{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}}
async function searchUsers(){let q=$('searchInput').value.trim();let req=db.from('profiles').select('*').neq('id',me.id).limit(30);if(q)req=req.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);let{data,error}=await req;if(error)return toast(error.message);$('searchResults').innerHTML=data?.length?data.map(userRow).join(''):'<div style="padding:20px;text-align:center" class="muted">Ничего не найдено</div>'}
function userRow(u){return `<div class="user">${avatarHTML(u)}<div class="user-main"><b>${esc(u.full_name||u.username)}</b><div class="muted">@${esc(u.username)}</div><div id="status-${u.id}">${statusHTML(u)}</div></div><button class="btn outline" onclick="openProfile('${u.id}')">Профиль</button></div>`}
function isOnline(u){return u?.last_seen && Date.now()-new Date(u.last_seen).getTime()<90000}
function statusHTML(u){return `<span class="status"><span class="status-dot ${isOnline(u)?'':'offline'}"></span>${isOnline(u)?'В сети':'Был(а) '+time(u.last_seen||u.created_at)}</span>`}
async function openProfile(id){if(id===me.id){go('profile');return}let{data:u,error}=await db.from('profiles').select('*').eq('id',id).single();if(error||!u)return toast('Профиль не найден');let{count:friendsCount}=await db.from('friendships').select('id',{count:'exact',head:true}).or(`and(sender_id.eq.${id},status.eq.accepted),and(receiver_id.eq.${id},status.eq.accepted)`);let{data:posts}=await db.from('posts').select('*,profiles!posts_user_id_fkey(id,username,full_name,avatar_url)').eq('user_id',id).order('created_at',{ascending:false}).limit(50);let{data:f}=await db.from('friendships').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${me.id})`).maybeSingle();let action=!f?`<button class="btn" onclick="addFriend('${id}')">+ Добавить в друзья</button>`:f.status==='pending'&&f.sender_id===me.id?`<button class="btn outline" disabled>Заявка отправлена</button>`:f.status==='pending'?`<button class="btn" onclick="respondFromProfile('${f.id}','accepted','${id}')">Принять заявку</button>`:f.status==='accepted'?`<button class="btn outline" onclick="removeFriend('${id}')">Удалить из друзей</button>`:'';$('modalBody').innerHTML=`<div class="modal-head"><b>Профиль</b><button class="iconbtn" onclick="closeModal()">×</button></div><div style="text-align:center">${avatarHTML(u,'avatar lg')}<h2 style="margin-top:10px">${esc(u.full_name||u.username)}</h2><div class="muted">@${esc(u.username)}</div><div style="margin-top:6px">${statusHTML(u)}</div><p class="bio" style="margin-top:10px">${esc(u.bio||'Нет описания')}</p></div><div class="profile-stats"><div><b>${friendsCount||0}</b><span>Друзей</span></div><div><b>${posts?.length||0}</b><span>Постов</span></div></div><div style="display:grid;gap:8px;margin-bottom:15px"><button class="btn" onclick="closeModal();openChat('${id}','${esc(u.full_name||u.username)}')">✉ Написать</button>${action}</div><div style="font-weight:850;margin-bottom:8px">Публикации</div><div>${posts?.length?posts.map(postHTML).join(''):'<div class="muted" style="padding:15px;text-align:center">Публикаций нет.</div>'}</div>`;$('modal').classList.remove('hidden')}
async function addFriend(id){let{error}=await db.from('friendships').insert({sender_id:me.id,receiver_id:id,status:'pending'});if(error)toast(error.message);else{toast('Заявка отправлена');closeModal();loadFriends()}}
async function removeFriend(id){let{data}=await db.from('friendships').select('id').or(`and(sender_id.eq.${me.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${me.id})`).eq('status','accepted').maybeSingle();if(!data)return toast('Вы не друзья');let{error}=await db.from('friendships').delete().eq('id',data.id);if(error)return toast(error.message);toast('Друг удалён');closeModal();loadFriends()}
async function respondFromProfile(id,status,profileId){let{error}=await db.from('friendships').update({status}).eq('id',id);if(error)return toast(error.message);closeModal();loadFriends()}

async function loadFriends(){
 let{data:requests}=await db.from('friendships').select('id,sender_id,profiles!friendships_sender_id_fkey(*)').eq('receiver_id',me.id).eq('status','pending');$('requests').innerHTML=requests?.length?requests.map(r=>`<div class="user">${avatarHTML(r.profiles)}<div class="user-main"><b>${esc(r.profiles.full_name||r.profiles.username)}</b><div class="muted">@${esc(r.profiles.username)}</div></div><button class="btn" onclick="respond(${r.id},'accepted')">✓</button><button class="btn danger" onclick="respond(${r.id},'rejected')">×</button></div>`).join(''):'<div class="muted" style="padding:15px">Новых заявок нет</div>';
 let{data:fs}=await db.from('friendships').select('id,sender_id,receiver_id,sender:profiles!friendships_sender_id_fkey(*),receiver:profiles!friendships_receiver_id_fkey(*)').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).eq('status','accepted');
 $('friends').innerHTML=fs?.length?fs.map(f=>{let u=f.sender_id===me.id?f.receiver:f.sender;return `<div class="user">${avatarHTML(u)}<div class="user-main"><b>${esc(u.full_name||u.username)}</b><div class="muted">@${esc(u.username)}</div>${statusHTML(u)}</div><button class="btn outline" onclick="openProfile('${u.id}')">Профиль</button><button class="btn outline" onclick="openChat('${u.id}','${esc(u.full_name||u.username)}')">Чат</button><button class="btn danger" onclick="removeFriend('${u.id}')">Удалить</button></div>`}).join(''):'<div class="muted" style="padding:15px">Друзей пока нет.</div>';$('friendCount').textContent=(fs?.length||0)+' друзей'
}
async function respond(id,status){if(status==='accepted')await db.from('friendships').update({status}).eq('id',id);else await db.from('friendships').delete().eq('id',id);loadFriends()}

async function loadChats(){let{data:fs}=await db.from('friendships').select('sender_id,receiver_id,sender:profiles!friendships_sender_id_fkey(*),receiver:profiles!friendships_receiver_id_fkey(*)').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).eq('status','accepted');$('chatList').innerHTML=fs?.length?fs.map(f=>{let u=f.sender_id===me.id?f.receiver:f.sender;return `<div class="user" onclick="openChat('${u.id}','${esc(u.full_name||u.username)}')">${avatarHTML(u)}<div class="user-main"><b>${esc(u.full_name||u.username)}</b><div class="muted">@${esc(u.username)}</div>${statusHTML(u)}</div><span>›</span></div>`}).join(''):'<div style="padding:22px;text-align:center" class="muted">Добавьте друзей, чтобы начать чат.</div>'}
function openChat(id,name){chatPartner={id,name};go('messages');$('chatList').classList.add('hidden');$('chatWindow').classList.remove('hidden');$('chatName').innerHTML=esc(name);loadChatPartnerStatus();loadMessages()}
async function loadChatPartnerStatus(){if(!chatPartner)return;let{data:u}=await db.from('profiles').select('last_seen').eq('id',chatPartner.id).single();let el=$('chatStatus');if(el)el.innerHTML=u?statusHTML(u):''}
function closeChat(){chatPartner=null;$('chatWindow').classList.add('hidden');$('chatList').classList.remove('hidden')}
async function loadMessages(){if(!chatPartner)return;let{data}=await db.from('direct_messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${chatPartner.id}),and(sender_id.eq.${chatPartner.id},receiver_id.eq.${me.id})`).order('created_at');$('messages').innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':'theirs'}">${m.image_url?`<img src="${esc(m.image_url)}" style="max-width:100%;border-radius:10px;display:block;margin-bottom:5px">`:''}${esc(m.content||'')}<div style="font-size:9px;opacity:.7;margin-top:3px">${time(m.created_at)}</div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
async function sendMessage(){let text=$('messageInput').value.trim();if(!text||!chatPartner)return;$('messageInput').value='';let{error}=await db.from('direct_messages').insert({sender_id:me.id,receiver_id:chatPartner.id,content:text});if(error)toast(error.message);else loadMessages()}

async function loadMyPosts(){let{data}=await db.from('posts').select('*,profiles!posts_user_id_fkey(id,username,full_name,avatar_url)').eq('user_id',me.id).order('created_at',{ascending:false});$('myPosts').innerHTML=data?.length?data.map(postHTML).join(''):'<div class="card" style="padding:20px;text-align:center"><span class="muted">У вас пока нет публикаций.</span></div>';await loadMyProfileStats()}
async function loadMyProfileStats(){let{count:fc}=await db.from('friendships').select('id',{count:'exact',head:true}).or(`and(sender_id.eq.${me.id},status.eq.accepted),and(receiver_id.eq.${me.id},status.eq.accepted)`);let{count:pc}=await db.from('posts').select('id',{count:'exact',head:true}).eq('user_id',me.id);$('profileFriendsCount').textContent=fc||0;$('profilePostsCount').textContent=pc||0;$('profileStatus').innerHTML=statusHTML(profile)}
function openEditProfile(){$('modalBody').innerHTML=`<div class="modal-head"><b>Редактировать профиль</b><button class="iconbtn" onclick="closeModal()">×</button></div><div class="muted" style="margin-bottom:8px">Имя и username можно менять не более 2 раз за 7 дней.</div><input id="editName" class="input" value="${esc(profile.full_name||'')}" placeholder="Имя"><input id="editUsername" class="input" style="margin-top:9px" value="${esc(profile.username||'')}" placeholder="Username"><textarea id="editBio" class="input" style="margin-top:9px;height:100px" placeholder="О себе">${esc(profile.bio||'')}</textarea><input id="editAvatar" class="input" style="margin-top:9px" value="${esc(profile.avatar_url||'')}" placeholder="URL аватара"><button class="btn" style="width:100%;margin-top:12px" onclick="saveProfile()">Сохранить</button>`;$('modal').classList.remove('hidden')}
async function saveProfile(){let full_name=$('editName').value.trim(),username=$('editUsername').value.trim().replace(/^@/,''),bio=$('editBio').value.trim(),avatar_url=$('editAvatar').value.trim();if(!full_name||!username)return toast('Имя и username обязательны');let nameChanged=full_name!==profile.full_name,usernameChanged=username!==profile.username;let log=Array.isArray(profile.profile_change_log)?profile.profile_change_log:[];let cutoff=Date.now()-7*24*60*60*1000;log=log.filter(x=>new Date(x).getTime()>cutoff);if((nameChanged||usernameChanged)&&log.length>=2)return toast('Лимит: 2 изменения имени/username за 7 дней');let update={full_name,username,bio,avatar_url};if(nameChanged||usernameChanged)update.profile_change_log=[...log,new Date().toISOString()];let{error}=await db.from('profiles').update(update).eq('id',me.id);if(error)return toast(error.message);closeModal();await loadProfile();await loadMyPosts();toast('Профиль обновлён')}
function openSettings(){$('modalBody').innerHTML=`<div class="modal-head"><b>Настройки</b><button class="iconbtn" onclick="closeModal()">×</button></div><button class="btn outline" style="width:100%;margin-bottom:8px" onclick="toggleTheme()">Сменить тему: ${document.documentElement.dataset.theme==='dark'?'Белая':'Чёрная'}</button><button class="btn danger" style="width:100%" onclick="logout()">Выйти из аккаунта</button>`;$('modal').classList.remove('hidden')}
function toggleTheme(){let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('mb-theme',t);openSettings()}
async function logout(){closeModal();await db.auth.signOut()}
function closeModal(){$('modal').classList.add('hidden')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
let saved=localStorage.getItem('mb-theme');if(saved)document.documentElement.dataset.theme=saved;

function startRealtime(){if(realtimeStarted)return;realtimeStarted=true;db.channel('mb-live').on('postgres_changes',{event:'*',schema:'public',table:'direct_messages'},()=>{if(chatPartner)loadMessages()}).on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>{if($('view-home').classList.contains('active'))loadFeed()}).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>{if($('view-messages').classList.contains('active'))loadChats();if(chatPartner)loadChatPartnerStatus()}).subscribe()}
</script>
</body>
