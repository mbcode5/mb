<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Social Chat Mobile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --text: #050505;
      --subtext: #65676b;
      --border: #e4e6eb;
      --input-bg: #f0f2f5;
      --primary: #1877f2;
      --primary-hover: #166fe5;
      --msg-my: #1877f2;
      --msg-my-text: #ffffff;
      --msg-their: #e4e6eb;
      --msg-their-text: #050505;
      --shadow: 0 12px 28px rgba(0,0,0,0.1);
      --modal-bg: rgba(0, 0, 0, 0.5);
    }

    [data-theme="dark"] {
      --bg: #18191a;
      --surface: #242526;
      --text: #e4e6eb;
      --subtext: #b0b3b8;
      --border: #393a3b;
      --input-bg: #3a3b3c;
      --primary: #2374e1;
      --primary-hover: #3982e8;
      --msg-my: #2374e1;
      --msg-my-text: #ffffff;
      --msg-their: #3a3b3c;
      --msg-their-text: #e4e6eb;
      --shadow: 0 12px 28px rgba(0,0,0,0.4);
      --modal-bg: rgba(0, 0, 0, 0.75);
    }

    [data-theme="matrix"] {
      --bg: #000000;
      --surface: #051105;
      --text: #00ff66;
      --subtext: #009933;
      --border: #003311;
      --input-bg: #001a08;
      --primary: #00ff66;
      --primary-hover: #33ff88;
      --msg-my: #00441b;
      --msg-my-text: #00ff66;
      --msg-their: #001a08;
      --msg-their-text: #00ff66;
      --shadow: 0 0 20px rgba(0,255,102,0.15);
      --modal-bg: rgba(0, 20, 0, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; height: 100dvh; width: 100%; background-color: var(--bg); color: var(--text); overflow: hidden; }

    /* Главный мобильный контейнер */
    .app-container { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 500px; margin: 0 auto; background: var(--surface); position: relative; }

    /* Шапка приложения */
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .app-header h2 { font-size: 18px; font-weight: 700; color: var(--primary); }

    /* Нижняя навигационная панель */
    .nav-bar { display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    .nav-item { background: transparent; border: none; color: var(--subtext); font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
    .nav-item.active { color: var(--primary); }
    .nav-item span { font-size: 10px; }

    /* Область содержимого */
    .view-content { flex: 1; overflow-y: auto; padding: 14px; display: none; flex-direction: column; }
    .view-content.active { display: flex; }

    /* Элементы чата */
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); border-radius: 12px; margin-bottom: 10px; }
    .msg-group { display: flex; flex-direction: column; max-width: 80%; }
    .msg-group.my { align-self: flex-end; align-items: flex-end; }
    .msg-group.their { align-self: flex-start; align-items: flex-start; }
    .msg-meta { font-size: 10px; color: var(--subtext); margin-bottom: 2px; font-weight: 600; }
    .msg-bubble { padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.35; word-break: break-word; }
    .msg-group.my .msg-bubble { background: var(--msg-my); color: var(--msg-my-text); border-bottom-right-radius: 2px; }
    .msg-group.their .msg-bubble { background: var(--msg-their); color: var(--msg-their-text); border-bottom-left-radius: 2px; }

    .input-bar { display: flex; gap: 8px; }
    .input-bar input, .custom-input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; font-size: 14px; }
    
    .btn { padding: 8px 14px; border-radius: 18px; border: none; font-weight: 600; cursor: pointer; background: var(--primary); color: white; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-secondary { background: #10b981; }
    .btn-danger { background: #ef4444; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 12px; }

    /* Карточки пользователей */
    .user-card { display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 8px; }
    .user-info-block { display: flex; align-items: center; gap: 10px; }
    .avatar-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }

    /* Модальное окно */
    .modal-backdrop { position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal { background: var(--surface); padding: 20px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid var(--border); box-shadow: var(--shadow); }

    .hidden { display: none !important; }
    .auth-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
    .auth-card { background: var(--surface); padding: 24px; border-radius: 16px; width: 100%; max-width: 360px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  </style>
</head>
<body>

  <!-- Авторизация -->
  <div id="auth-section" class="auth-overlay">
    <div class="auth-card">
      <h2 style="text-align: center; margin-bottom: 12px; color: var(--primary);">Facebook Mobile</h2>
      <div style="display: flex; gap: 6px; margin-bottom: 14px;">
        <button id="tab-login-btn" class="btn" style="flex:1;" onclick="switchAuthTab('login')">Вход</button>
        <button id="tab-reg-btn" class="btn" style="flex:1; background: var(--input-bg); color: var(--text);" onclick="switchAuthTab('reg')">Регистрация</button>
      </div>

      <div id="login-form">
        <input type="email" id="login-email" class="custom-input" placeholder="Email" style="width: 100%; margin-bottom: 8px;">
        <input type="password" id="login-password" class="custom-input" placeholder="Пароль" style="width: 100%; margin-bottom: 8px;">
        <button class="btn" style="width: 100%; border-radius: 10px;" onclick="login()">Войти</button>
      </div>

      <div id="reg-form" class="hidden">
        <input type="text" id="reg-username" class="custom-input" placeholder="Имя / Никнейм" style="width: 100%; margin-bottom: 8px;">
        <input type="email" id="reg-email" class="custom-input" placeholder="Email" style="width: 100%; margin-bottom: 8px;">
        <input type="password" id="reg-password" class="custom-input" placeholder="Пароль (мин. 6)" style="width: 100%; margin-bottom: 8px;">
        <button class="btn btn-secondary" style="width: 100%; border-radius: 10px;" onclick="register()">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <!-- Главный Интерфейс -->
  <div id="app-section" class="app-container hidden">
    <!-- Шапка -->
    <div class="app-header">
      <h2 id="header-title">💬 Общий Чат</h2>
      <button class="btn btn-sm" style="background:var(--input-bg); color:var(--text);" onclick="openSettings()">⚙️</button>
    </div>

    <!-- Вкладка 1: ОБЩИЙ ЧАТ -->
    <div id="view-chat" class="view-content active">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 12px; color: var(--subtext); font-weight: 600;">Публичные сообщения</span>
        <button class="btn btn-danger btn-sm" onclick="clearGeneralChatHistory()">🗑️ Очистить</button>
      </div>
      <div id="chat-box" class="chat-messages"></div>
      <div class="input-bar">
        <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <!-- Вкладка 2: ЛИЧНЫЕ СООБЩЕНИЯ (ЛС) -->
    <div id="view-dm" class="view-content">
      <div id="dm-select-screen">
        <h3 style="margin-bottom: 10px;">Выберите друга для чата:</h3>
        <div id="dm-friends-list"></div>
      </div>

      <div id="dm-chat-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <button class="btn btn-sm" style="background:var(--input-bg);color:var(--text);" onclick="closeDmChat()">← Назад</button>
          <b id="dm-partner-name">---</b>
          <button class="btn btn-danger btn-sm" onclick="clearDmHistory()">🗑️</button>
        </div>
        <div id="dm-chat-box" class="chat-messages"></div>
        <div class="input-bar">
          <input type="text" id="dm-message-input" placeholder="Личное сообщение..." onkeydown="if(event.key==='Enter') sendDmMessage()">
          <button class="btn" onclick="sendDmMessage()">➤</button>
        </div>
      </div>
    </div>

    <!-- Вкладка 3: ПОИСК ПОЛЬЗОВАТЕЛЕЙ -->
    <div id="view-search" class="view-content">
      <div style="display: flex; gap: 6px; margin-bottom: 12px;">
        <input type="text" id="search-input" class="custom-input" placeholder="Поиск по имени или нику..." onkeydown="if(event.key==='Enter') searchUsers()">
        <button class="btn" onclick="searchUsers()">Искать</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Вкладка 4: ДРУЗЬЯ -->
    <div id="view-friends" class="view-content">
      <h3 style="margin-bottom: 8px; font-size:15px;">Входящие заявки</h3>
      <div id="incoming-requests" style="margin-bottom: 16px;"></div>

      <h3 style="margin-bottom: 8px; font-size:15px;">Мои друзья</h3>
      <div id="friends-list"></div>
    </div>

    <!-- Вкладка 5: ПРОФИЛЬ -->
    <div id="view-profile" class="view-content">
      <div style="text-align: center; margin-bottom: 16px;">
        <div id="profile-avatar-display" class="avatar-img" style="width: 72px; height: 72px; font-size: 28px; margin: 0 auto 8px auto;">?</div>
        <h3 id="profile-name-display">Имя Фамилия</h3>
        <p id="profile-bio-display" style="color: var(--subtext); font-size: 13px; margin-top: 2px;">---</p>
      </div>

      <div style="background: var(--input-bg); padding: 12px; border-radius: 12px;">
        <h4 style="margin-bottom: 8px; font-size: 14px;">Редактировать профиль</h4>
        <input type="text" id="edit-fullname" class="custom-input" placeholder="Полное Имя" style="width: 100%; margin-bottom: 8px;">
        <input type="text" id="edit-avatar" class="custom-input" placeholder="Ссылка на фото (URL)" style="width: 100%; margin-bottom: 8px;">
        <textarea id="edit-bio" class="custom-input" placeholder="О себе..." style="width: 100%; height: 60px; margin-bottom: 8px;"></textarea>
        <button class="btn" style="width: 100%; border-radius: 10px;" onclick="saveProfile()">Сохранить</button>
      </div>
    </div>

    <!-- Навигация Внизу -->
    <div class="nav-bar">
      <button class="nav-item active" onclick="switchView('chat', this, '💬 Общий Чат')">💬<span>Чат</span></button>
      <button class="nav-item" onclick="switchView('dm', this, '✉️ Личные сообщения')">✉️<span>ЛС</span></button>
      <button class="nav-item" onclick="switchView('search', this, '🔍 Поиск людей')">🔍<span>Поиск</span></button>
      <button class="nav-item" onclick="switchView('friends', this, '👥 Мои Друзья')">👥<span>Друзья</span></button>
      <button class="nav-item" onclick="switchView('profile', this, '👤 Мой Профиль')">👤<span>Профиль</span></button>
    </div>
  </div>

  <!-- Модальное окно Настроек -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>⚙️ Настройки</h3>
        <button class="btn btn-sm" onclick="closeSettings()">✕</button>
      </div>
      <button class="btn" onclick="toggleTheme()" style="width: 100%; margin-bottom: 12px; background:var(--input-bg); color:var(--text);">☀️ / 🌙 Сменить тему</button>
      <button class="btn btn-danger" style="width: 100%;" onclick="logout()">🚪 Выйти из аккаунта</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgnmaoybgwesqctysveu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TSFvhqldPDdWGncB92rVag_KkdkwlZP";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let myProfileData = null;
    let activeDmPartner = null;

    // --- Переключение Темы ---
    let currentTheme = localStorage.getItem('chat_theme') || 'light';
    applyTheme(currentTheme);

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('chat_theme', theme);
      currentTheme = theme;
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    }

    // --- Авторизация ---
    db.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        showApp();
      } else {
        currentUser = null;
        showAuth();
      }
    });

    function switchAuthTab(type) {
      document.getElementById('login-form').classList.toggle('hidden', type !== 'login');
      document.getElementById('reg-form').classList.toggle('hidden', type !== 'reg');
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!email || !password) return alert('Заполните все поля!');
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) alert('Ошибка входа: ' + error.message);
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      if (!username || !email || !password) return alert('Заполните все поля!');

      const { error } = await db.auth.signUp({
        email, password, options: { data: { username: username } }
      });

      if (error) return alert('Ошибка: ' + error.message);
      await db.auth.signInWithPassword({ email, password });
    }

    async function logout() {
      closeSettings();
      await db.auth.signOut();
    }

    function showApp() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      loadMyProfile();
      loadMessages();
      subscribeRealtime();
    }

    function showAuth() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
    }

    // --- Навигация ---
    function switchView(viewName, btn, title) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`view-${viewName}`).classList.add('active');
      if (btn) btn.classList.add('active');
      if (title) document.getElementById('header-title').innerText = title;

      if (viewName === 'friends') loadFriendsAndRequests();
      if (viewName === 'search') searchUsers();
      if (viewName === 'dm') loadDmFriends();
    }

    // --- ПРОФИЛЬ ---
    async function loadMyProfile() {
      let { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
      
      if (!data) {
        const defaultName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        await db.from('profiles').insert([{ id: currentUser.id, username: defaultName, full_name: defaultName }]);
        data = { id: currentUser.id, username: defaultName, full_name: defaultName };
      }

      myProfileData = data;
      document.getElementById('profile-name-display').innerText = data.full_name || data.username;
      document.getElementById('profile-bio-display').innerText = data.bio || 'Нет описания';
      
      const avatarBox = document.getElementById('profile-avatar-display');
      if (data.avatar_url) {
        avatarBox.innerHTML = `<img src="${data.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarBox.innerText = (data.full_name || data.username).charAt(0).toUpperCase();
      }

      document.getElementById('edit-fullname').value = data.full_name || '';
      document.getElementById('edit-avatar').value = data.avatar_url || '';
      document.getElementById('edit-bio').value = data.bio || '';
    }

    async function saveProfile() {
      const full_name = document.getElementById('edit-fullname').value.trim();
      const avatar_url = document.getElementById('edit-avatar').value.trim();
      const bio = document.getElementById('edit-bio').value.trim();

      const { error } = await db.from('profiles').update({ full_name, avatar_url, bio }).eq('id', currentUser.id);

      if (error) alert('Ошибка: ' + error.message);
      else {
        alert('Профиль сохранен!');
        loadMyProfile();
      }
    }

    // --- ПОИСК ЛЮДЕЙ ---
    async function searchUsers() {
      const query = document.getElementById('search-input').value.trim();
      let req = db.from('profiles').select('*').neq('id', currentUser.id);

      if (query) {
        req = req.or(`username.ilike.%${query}%,full_name.ilike.%${query}%`);
      }

      const { data, error } = await req.limit(30);
      const container = document.getElementById('search-results');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:var(--subtext); text-align:center; margin-top:20px;">Ничего не найдено</p>';
        return;
      }

      data.forEach(user => {
        const div = document.createElement('div');
        div.className = 'user-card';
        div.innerHTML = `
          <div class="user-info-block">
            <div class="avatar-img">${user.avatar_url ? `<img src="${user.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : user.username.charAt(0).toUpperCase()}</div>
            <div>
              <b>${escapeHtml(user.full_name || user.username)}</b>
              <p style="font-size:11px;color:var(--subtext);">@${escapeHtml(user.username)}</p>
            </div>
          </div>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-sm" onclick="sendFriendRequest('${user.id}', this)">+ Друг</button>
            <button class="btn btn-sm btn-secondary" onclick="openDmWith('${user.id}', '${escapeHtml(user.full_name || user.username)}')">💬</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function sendFriendRequest(receiverId, btn) {
      const { error } = await db.from('friendships').insert([{
        sender_id: currentUser.id,
        receiver_id: receiverId,
        status: 'pending'
      }]);

      if (error) {
        alert('Заявка уже отправлена!');
      } else {
        btn.innerText = 'Отправлено';
        btn.disabled = true;
      }
    }

    // --- ДРУЗЬЯ ---
    async function loadFriendsAndRequests() {
      const { data: requests } = await db.from('friendships')
        .select('id, sender_id, profiles!friendships_sender_id_fkey(*)')
        .eq('receiver_id', currentUser.id)
        .eq('status', 'pending');

      const reqBox = document.getElementById('incoming-requests');
      reqBox.innerHTML = '';

      if (!requests || requests.length === 0) {
        reqBox.innerHTML = '<p style="color:var(--subtext);font-size:12px;">Нет новых заявок</p>';
      } else {
        requests.forEach(r => {
          const u = r.profiles;
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `
            <div class="user-info-block">
              <div class="avatar-img">${u.avatar_url ? `<img src="${u.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : u.username.charAt(0).toUpperCase()}</div>
              <div><b>${escapeHtml(u.full_name || u.username)}</b></div>
            </div>
            <div style="display:flex;gap:4px;">
              <button class="btn btn-sm btn-secondary" onclick="respondFriendship(${r.id}, 'accepted')">✓</button>
              <button class="btn btn-sm btn-danger" onclick="respondFriendship(${r.id}, 'rejected')">✕</button>
            </div>
          `;
          reqBox.appendChild(div);
        });
      }

      const { data: friends } = await db.from('friendships')
        .select('id, sender_id, receiver_id, sender:profiles!friendships_sender_id_fkey(*), receiver:profiles!friendships_receiver_id_fkey(*)')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');

      const friendsBox = document.getElementById('friends-list');
      friendsBox.innerHTML = '';

      if (!friends || friends.length === 0) {
        friendsBox.innerHTML = '<p style="color:var(--subtext);font-size:12px;">Список друзей пуст</p>';
      } else {
        friends.forEach(f => {
          const friendProfile = f.sender_id === currentUser.id ? f.receiver : f.sender;
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `
            <div class="user-info-block">
              <div class="avatar-img">${friendProfile.avatar_url ? `<img src="${friendProfile.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : friendProfile.username.charAt(0).toUpperCase()}</div>
              <div>
                <b>${escapeHtml(friendProfile.full_name || friendProfile.username)}</b>
              </div>
            </div>
            <button class="btn btn-sm" onclick="openDmWith('${friendProfile.id}', '${escapeHtml(friendProfile.full_name || friendProfile.username)}')">💬 Написать</button>
          `;
          friendsBox.appendChild(div);
        });
      }
    }

    async function respondFriendship(friendshipId, status) {
      if (status === 'accepted') {
        await db.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId);
      } else {
        await db.from('friendships').delete().eq('id', friendshipId);
      }
      loadFriendsAndRequests();
    }

    // --- ЛИЧНЫЕ СООБЩЕНИЯ (ЛС) ---
    async function loadDmFriends() {
      const { data: friends } = await db.from('friendships')
        .select('id, sender_id, receiver_id, sender:profiles!friendships_sender_id_fkey(*), receiver:profiles!friendships_receiver_id_fkey(*)')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');

      const container = document.getElementById('dm-friends-list');
      container.innerHTML = '';

      if (!friends || friends.length === 0) {
        container.innerHTML = '<p style="color:var(--subtext); font-size:13px;">У вас пока нет друзей для переписки</p>';
        return;
      }

      friends.forEach(f => {
        const friend = f.sender_id === currentUser.id ? f.receiver : f.sender;
        const div = document.createElement('div');
        div.className = 'user-card';
        div.innerHTML = `
          <div class="user-info-block">
            <div class="avatar-img">${friend.avatar_url ? `<img src="${friend.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : friend.username.charAt(0).toUpperCase()}</div>
            <div><b>${escapeHtml(friend.full_name || friend.username)}</b></div>
          </div>
          <button class="btn btn-sm" onclick="openDmWith('${friend.id}', '${escapeHtml(friend.full_name || friend.username)}')">Открыть диалог</button>
        `;
        container.appendChild(div);
      });
    }

    function openDmWith(friendId, friendName) {
      activeDmPartner = { id: friendId, name: friendName };
      document.getElementById('dm-select-screen').classList.add('hidden');
      document.getElementById('dm-chat-screen').classList.remove('hidden');
      document.getElementById('dm-partner-name').innerText = friendName;
      
      switchView('dm', document.querySelectorAll('.nav-item')[1], '✉️ Чат с ' + friendName);
      loadDmMessages();
    }

    function closeDmChat() {
      activeDmPartner = null;
      document.getElementById('dm-select-screen').classList.remove('hidden');
      document.getElementById('dm-chat-screen').classList.add('hidden');
    }

    async function loadDmMessages() {
      if (!activeDmPartner) return;
      const { data } = await db.from('direct_messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeDmPartner.id}),and(sender_id.eq.${activeDmPartner.id},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      const box = document.getElementById('dm-chat-box');
      box.innerHTML = '';
      if (data) {
        data.forEach(msg => {
          const isMy = msg.sender_id === currentUser.id;
          const div = document.createElement('div');
          div.className = `msg-group ${isMy ? 'my' : 'their'}`;
          div.innerHTML = `
            <div class="msg-meta">${isMy ? 'Вы' : activeDmPartner.name}</div>
            <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          `;
          box.appendChild(div);
        });
      }
      box.scrollTop = box.scrollHeight;
    }

    async function sendDmMessage() {
      const input = document.getElementById('dm-message-input');
      const text = input.value.trim();
      if (!text || !activeDmPartner) return;
      input.value = '';

      await db.from('direct_messages').insert([{
        sender_id: currentUser.id,
        receiver_id: activeDmPartner.id,
        content: text
      }]);

      loadDmMessages();
    }

    async function clearDmHistory() {
      if (!activeDmPartner || !confirm('Очистить историю этого диалога?')) return;
      await db.from('direct_messages')
        .delete()
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeDmPartner.id}),and(sender_id.eq.${activeDmPartner.id},receiver_id.eq.${currentUser.id})`);
      loadDmMessages();
    }

    // --- ОБЩИЙ ЧАТ ---
    async function loadMessages() {
      const { data } = await db.from('group_messages').select('*').order('created_at', { ascending: true }).limit(100);
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      if (data) data.forEach(msg => renderMessage(msg));
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderMessage(msg) {
      const chatBox = document.getElementById('chat-box');
      const myName = myProfileData?.username || currentUser?.email.split('@')[0];
      const isMy = msg.username === myName;

      const div = document.createElement('div');
      div.className = `msg-group ${isMy ? 'my' : 'their'}`;
      div.innerHTML = `
        <div class="msg-meta">${isMy ? 'Вы' : escapeHtml(msg.username)}</div>
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const myName = myProfileData?.full_name || myProfileData?.username || currentUser.email.split('@')[0];
      input.value = '';

      await db.from('group_messages').insert([{ username: myName, content: text }]);
    }

    async function clearGeneralChatHistory() {
      if (!confirm('Вы точно хотите очистить всю историю общего чата?')) return;
      await db.from('group_messages').delete().gte('id', 0);
      loadMessages();
    }

    function subscribeRealtime() {
      db.channel('public_chats')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'group_messages' }, () => loadMessages())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'direct_messages' }, () => {
          if (activeDmPartner) loadDmMessages();
        })
        .subscribe();
    }

    // --- МОДАЛЬНОЕ ОКНО НАСТРОЕК ---
    function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }
  </script>
</body>
</html>
