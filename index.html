<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Social Chat Mobile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --input-bg: #f1f5f9;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #3b82f6;
      --msg-my: #2563eb;
      --msg-my-text: #ffffff;
      --msg-their: #e2e8f0;
      --msg-their-text: #0f172a;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      --modal-bg: rgba(15, 23, 42, 0.6);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --input-bg: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent: #60a5fa;
      --msg-my: #2563eb;
      --msg-my-text: #ffffff;
      --msg-their: #334155;
      --msg-their-text: #f8fafc;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      --modal-bg: rgba(0, 0, 0, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; height: 100dvh; width: 100%; background-color: var(--bg); color: var(--text); overflow: hidden; }

    /* Мобильный контейнер */
    .app-container { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 500px; margin: 0 auto; background: var(--surface); position: relative; box-shadow: var(--shadow); }

    /* Шапка */
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .app-header h2 { font-size: 19px; font-weight: 700; color: var(--primary); }

    /* Нижняя Навигация */
    .nav-bar { display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .nav-item { background: transparent; border: none; color: var(--subtext); font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; transition: all 0.2s; }
    .nav-item.active { color: var(--primary); }
    .nav-item span { font-size: 11px; }

    /* Содержимое */
    .view-content { flex: 1; overflow-y: auto; padding: 14px; display: none; flex-direction: column; }
    .view-content.active { display: flex; }

    /* Элементы Чата */
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); border-radius: 16px; margin-bottom: 10px; }
    .msg-group { display: flex; flex-direction: column; max-width: 80%; }
    .msg-group.my { align-self: flex-end; align-items: flex-end; }
    .msg-group.their { align-self: flex-start; align-items: flex-start; }
    .msg-meta { font-size: 10px; color: var(--subtext); margin-bottom: 3px; font-weight: 600; }
    .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg-group.my .msg-bubble { background: var(--msg-my); color: var(--msg-my-text); border-bottom-right-radius: 4px; }
    .msg-group.their .msg-bubble { background: var(--msg-their); color: var(--msg-their-text); border-bottom-left-radius: 4px; }

    .input-bar { display: flex; gap: 8px; }
    .input-bar input, .custom-input { flex: 1; padding: 11px 16px; border-radius: 22px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; font-size: 14px; }
    
    .btn { padding: 9px 16px; border-radius: 20px; border: none; font-weight: 600; cursor: pointer; background: var(--primary); color: white; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #10b981; color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: #ef4444; color: white; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 14px; }

    /* Карточки пользователей и диалогов */
    .user-card { display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 12px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 10px; cursor: pointer; transition: transform 0.1s, background-color 0.2s; }
    .user-card:active { transform: scale(0.98); }
    .user-info-block { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
    
    .avatar-img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(37,99,235,0.2); }

    /* Модальные окна */
    .modal-backdrop { position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal { background: var(--surface); padding: 22px; border-radius: 20px; width: 100%; max-width: 380px; border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* Дизайн Профиля */
    .profile-header-card { text-align: center; padding: 16px; background: var(--input-bg); border-radius: 16px; margin-bottom: 16px; }
    .profile-avatar-lg { width: 84px; height: 84px; font-size: 32px; margin: 0 auto 12px auto; }
    .profile-bio-box { background: var(--surface); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-top: 10px; font-size: 13px; color: var(--subtext); text-align: left; }

    .hidden { display: none !important; }
    .auth-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
    .auth-card { background: var(--surface); padding: 26px; border-radius: 20px; width: 100%; max-width: 360px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  </style>
</head>
<body>

  <!-- Вход / Регистрация -->
  <div id="auth-section" class="auth-overlay">
    <div class="auth-card">
      <h2 style="text-align: center; margin-bottom: 14px; color: var(--primary); font-size: 22px;">Social Chat</h2>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button id="tab-login-btn" class="btn" style="flex:1;" onclick="switchAuthTab('login')">Вход</button>
        <button id="tab-reg-btn" class="btn btn-outline" style="flex:1;" onclick="switchAuthTab('reg')">Регистрация</button>
      </div>

      <div id="login-form">
        <input type="email" id="login-email" class="custom-input" placeholder="Email" style="width: 100%; margin-bottom: 10px;">
        <input type="password" id="login-password" class="custom-input" placeholder="Пароль" style="width: 100%; margin-bottom: 12px;">
        <button class="btn" style="width: 100%; border-radius: 12px;" onclick="login()">Войти</button>
      </div>

      <div id="reg-form" class="hidden">
        <input type="text" id="reg-username" class="custom-input" placeholder="Имя / Никнейм" style="width: 100%; margin-bottom: 10px;">
        <input type="email" id="reg-email" class="custom-input" placeholder="Email" style="width: 100%; margin-bottom: 10px;">
        <input type="password" id="reg-password" class="custom-input" placeholder="Пароль (мин. 6 символов)" style="width: 100%; margin-bottom: 12px;">
        <button class="btn btn-secondary" style="width: 100%; border-radius: 12px;" onclick="register()">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <!-- Главный Интерфейс -->
  <div id="app-section" class="app-container hidden">
    <!-- Шапка -->
    <div class="app-header">
      <h2 id="header-title">💬 Чаты</h2>
      <button class="btn btn-sm btn-outline" onclick="openSettings()">⚙️</button>
    </div>

    <!-- Вкладка 1: ЧАТЫ (ДИАЛОГИ) -->
    <div id="view-chats" class="view-content active">
      <div id="chats-list-screen">
        <p style="font-size: 12px; color: var(--subtext); margin-bottom: 10px; font-weight: 600;">Ваши переписки</p>
        <div id="chats-friends-list"></div>
      </div>

      <div id="active-chat-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <button class="btn btn-sm btn-outline" onclick="closeActiveChat()">← Назад</button>
          <div style="text-align: center; cursor: pointer;" onclick="viewPartnerProfile()">
            <b id="active-partner-name" style="font-size: 15px;">---</b>
            <p style="font-size: 11px; color: var(--primary);">посмотреть профиль</p>
          </div>
          <button class="btn btn-danger btn-sm" onclick="clearDmHistory()">🗑️</button>
        </div>
        <div id="dm-chat-box" class="chat-messages"></div>
        <div class="input-bar">
          <input type="text" id="dm-message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendDmMessage()">
          <button class="btn" onclick="sendDmMessage()">➤</button>
        </div>
      </div>
    </div>

    <!-- Вкладка 2: ПОИСК -->
    <div id="view-search" class="view-content">
      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <input type="text" id="search-input" class="custom-input" placeholder="Поиск по имени или нику..." onkeydown="if(event.key==='Enter') searchUsers()">
        <button class="btn" onclick="searchUsers()">Искать</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Вкладка 3: ДРУЗЬЯ -->
    <div id="view-friends" class="view-content">
      <h3 style="margin-bottom: 10px; font-size:15px;">Входящие заявки</h3>
      <div id="incoming-requests" style="margin-bottom: 18px;"></div>

      <h3 style="margin-bottom: 10px; font-size:15px;">Мои друзья</h3>
      <div id="friends-list"></div>
    </div>

    <!-- Вкладка 4: МОЙ ПРОФИЛЬ -->
    <div id="view-profile" class="view-content">
      <div class="profile-header-card">
        <div id="my-avatar-display" class="avatar-img profile-avatar-lg">?</div>
        <h3 id="my-name-display" style="font-size: 18px; font-weight: 700;">---</h3>
        <p id="my-username-display" style="color: var(--primary); font-size: 13px; margin-top: 2px;">@username</p>
        <div class="profile-bio-box">
          <b>О себе:</b>
          <p id="my-bio-display" style="margin-top: 4px;">Заполните профиль...</p>
        </div>
      </div>

      <div style="background: var(--input-bg); padding: 14px; border-radius: 16px;">
        <h4 style="margin-bottom: 10px; font-size: 14px;">Редактировать профиль</h4>
        <input type="text" id="edit-fullname" class="custom-input" placeholder="Полное имя" style="width: 100%; margin-bottom: 8px;">
        <input type="text" id="edit-avatar" class="custom-input" placeholder="Ссылка на аватар (URL)" style="width: 100%; margin-bottom: 8px;">
        <textarea id="edit-bio" class="custom-input" placeholder="Напишите немного о себе..." style="width: 100%; height: 70px; margin-bottom: 10px;"></textarea>
        <button class="btn" style="width: 100%; border-radius: 12px;" onclick="saveProfile()">Сохранить профиль</button>
      </div>
    </div>

    <!-- Нижняя Навигация -->
    <div class="nav-bar">
      <button class="nav-item active" onclick="switchView('chats', this, '💬 Чаты')">💬<span>Чаты</span></button>
      <button class="nav-item" onclick="switchView('search', this, '🔍 Поиск пользователей')">🔍<span>Поиск</span></button>
      <button class="nav-item" onclick="switchView('friends', this, '👥 Друзья')">👥<span>Друзья</span></button>
      <button class="nav-item" onclick="switchView('profile', this, '👤 Мой профиль')">👤<span>Профиль</span></button>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Просмотр профиля другого пользователя -->
  <div id="user-profile-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="font-size: 16px;">Профиль пользователя</h3>
        <button class="btn btn-sm btn-outline" onclick="closeUserProfileModal()">✕</button>
      </div>

      <div class="profile-header-card" style="margin-bottom: 14px;">
        <div id="view-user-avatar" class="avatar-img profile-avatar-lg">?</div>
        <h3 id="view-user-fullname" style="font-size: 18px; font-weight: 700;">---</h3>
        <p id="view-user-username" style="color: var(--primary); font-size: 13px; margin-top: 2px;">@username</p>
        <div class="profile-bio-box">
          <b>О себе:</b>
          <p id="view-user-bio" style="margin-top: 4px;">Нет описания</p>
        </div>
      </div>

      <div id="user-profile-actions" style="display: flex; flex-direction: column; gap: 8px;">
        <!-- Кнопки действия (Динамические) -->
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Настройки -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3>⚙️ Настройки</h3>
        <button class="btn btn-sm btn-outline" onclick="closeSettings()">✕</button>
      </div>
      <button class="btn btn-outline" onclick="toggleTheme()" style="width: 100%; margin-bottom: 12px;">☀️ / 🌙 Сменить тему</button>
      <button class="btn btn-danger" style="width: 100%;" onclick="logout()">🚪 Выйти из аккаунта</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgnmaoybgwesqctysveu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TSFvhqldPDdWGncB92rVag_KkdkwlZP";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let myProfileData = null;
    let activeDmPartner = null;
    let selectedViewingUser = null;

    // --- Тема ---
    let currentTheme = localStorage.getItem('chat_theme') || 'light';
    applyTheme(currentTheme);

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('chat_theme', theme);
      currentTheme = theme;
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    }

    // --- Авторизация ---
    db.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        showApp();
      } else {
        currentUser = null;
        showAuth();
      }
    });

    function switchAuthTab(type) {
      document.getElementById('login-form').classList.toggle('hidden', type !== 'login');
      document.getElementById('reg-form').classList.toggle('hidden', type !== 'reg');
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!email || !password) return alert('Заполните все поля!');
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) alert('Ошибка входа: ' + error.message);
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      if (!username || !email || !password) return alert('Заполните все поля!');

      const { error } = await db.auth.signUp({
        email, password, options: { data: { username: username } }
      });

      if (error) return alert('Ошибка: ' + error.message);
      await db.auth.signInWithPassword({ email, password });
    }

    async function logout() {
      closeSettings();
      await db.auth.signOut();
    }

    function showApp() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      loadMyProfile();
      loadChatsList();
      subscribeRealtime();
    }

    function showAuth() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
    }

    // --- Навигация ---
    function switchView(viewName, btn, title) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`view-${viewName}`).classList.add('active');
      if (btn) btn.classList.add('active');
      if (title) document.getElementById('header-title').innerText = title;

      if (viewName === 'friends') loadFriendsAndRequests();
      if (viewName === 'search') searchUsers();
      if (viewName === 'chats') loadChatsList();
    }

    // --- МОЙ ПРОФИЛЬ ---
    async function loadMyProfile() {
      let { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
      
      if (!data) {
        const defaultName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        await db.from('profiles').insert([{ id: currentUser.id, username: defaultName, full_name: defaultName }]);
        data = { id: currentUser.id, username: defaultName, full_name: defaultName };
      }

      myProfileData = data;
      document.getElementById('my-name-display').innerText = data.full_name || data.username;
      document.getElementById('my-username-display').innerText = '@' + data.username;
      document.getElementById('my-bio-display').innerText = data.bio || 'Описание не заполнено';
      
      const avatarBox = document.getElementById('my-avatar-display');
      if (data.avatar_url) {
        avatarBox.innerHTML = `<img src="${data.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarBox.innerText = (data.full_name || data.username).charAt(0).toUpperCase();
      }

      document.getElementById('edit-fullname').value = data.full_name || '';
      document.getElementById('edit-avatar').value = data.avatar_url || '';
      document.getElementById('edit-bio').value = data.bio || '';
    }

    async function saveProfile() {
      const full_name = document.getElementById('edit-fullname').value.trim();
      const avatar_url = document.getElementById('edit-avatar').value.trim();
      const bio = document.getElementById('edit-bio').value.trim();

      const { error } = await db.from('profiles').update({ full_name, avatar_url, bio }).eq('id', currentUser.id);

      if (error) alert('Ошибка: ' + error.message);
      else {
        alert('Профиль сохранен!');
        loadMyProfile();
      }
    }

    // --- ПРОСМОТР ЧУЖОГО ПРОФИЛЯ ---
    async function openUserProfileModal(userId) {
      if (userId === currentUser.id) {
        switchView('profile', document.querySelectorAll('.nav-item')[3], '👤 Мой профиль');
        return;
      }

      const { data: profile } = await db.from('profiles').select('*').eq('id', userId).single();
      if (!profile) return alert('Пользователь не найден');

      selectedViewingUser = profile;

      document.getElementById('view-user-fullname').innerText = profile.full_name || profile.username;
      document.getElementById('view-user-username').innerText = '@' + profile.username;
      document.getElementById('view-user-bio').innerText = profile.bio || 'Пользователь ничего не написал о себе';

      const avatarBox = document.getElementById('view-user-avatar');
      if (profile.avatar_url) {
        avatarBox.innerHTML = `<img src="${profile.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarBox.innerText = (profile.full_name || profile.username).charAt(0).toUpperCase();
      }

      // Проверяем статус дружбы
      const { data: friendship } = await db.from('friendships')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`)
        .single();

      const actionsContainer = document.getElementById('user-profile-actions');
      actionsContainer.innerHTML = '';

      // Кнопка переписки
      const msgBtn = document.createElement('button');
      msgBtn.className = 'btn';
      msgBtn.style.width = '100%';
      msgBtn.innerText = '💬 Написать сообщение';
      msgBtn.onclick = () => {
        closeUserProfileModal();
        openDmWith(profile.id, profile.full_name || profile.username);
      };
      actionsContainer.appendChild(msgBtn);

      // Кнопка дружбы
      if (!friendship) {
        const addBtn = document.createElement('button');
        addBtn.className = 'btn btn-secondary';
        addBtn.style.width = '100%';
        addBtn.innerText = '+ Добавить в друзья';
        addBtn.onclick = async () => {
          await db.from('friendships').insert([{ sender_id: currentUser.id, receiver_id: userId, status: 'pending' }]);
          alert('Заявка отправлена!');
          openUserProfileModal(userId);
        };
        actionsContainer.appendChild(addBtn);
      } else if (friendship.status === 'pending') {
        const pendingBtn = document.createElement('button');
        pendingBtn.className = 'btn btn-outline';
        pendingBtn.style.width = '100%';
        pendingBtn.disabled = true;
        pendingBtn.innerText = friendship.sender_id === currentUser.id ? 'Заявка отправлена' : 'Ожидает вашего подтверждения';
        actionsContainer.appendChild(pendingBtn);
      } else if (friendship.status === 'accepted') {
        const removeBtn = document.createElement('button');
        removeBtn.className = 'btn btn-danger';
        removeBtn.style.width = '100%';
        removeBtn.innerText = 'Удалить из друзей';
        removeBtn.onclick = async () => {
          if (confirm('Удалить из друзей?')) {
            await db.from('friendships').delete().eq('id', friendship.id);
            openUserProfileModal(userId);
          }
        };
        actionsContainer.appendChild(removeBtn);
      }

      document.getElementById('user-profile-modal').classList.remove('hidden');
    }

    function closeUserProfileModal() {
      document.getElementById('user-profile-modal').classList.add('hidden');
    }

    function viewPartnerProfile() {
      if (activeDmPartner) {
        openUserProfileModal(activeDmPartner.id);
      }
    }

    // --- ПОИСК ЛЮДЕЙ ---
    async function searchUsers() {
      const query = document.getElementById('search-input').value.trim();
      let req = db.from('profiles').select('*').neq('id', currentUser.id);

      if (query) {
        req = req.or(`username.ilike.%${query}%,full_name.ilike.%${query}%`);
      }

      const { data } = await req.limit(30);
      const container = document.getElementById('search-results');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:var(--subtext); text-align:center; margin-top:20px;">Ничего не найдено</p>';
        return;
      }

      data.forEach(user => {
        const div = document.createElement('div');
        div.className = 'user-card';
        div.onclick = () => openUserProfileModal(user.id);
        div.innerHTML = `
          <div class="user-info-block">
            <div class="avatar-img">${user.avatar_url ? `<img src="${user.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : user.username.charAt(0).toUpperCase()}</div>
            <div style="overflow:hidden;">
              <b style="display:block; text-overflow:ellipsis; overflow:hidden; whitespace:nowrap;">${escapeHtml(user.full_name || user.username)}</b>
              <p style="font-size:12px;color:var(--subtext);">@${escapeHtml(user.username)}</p>
            </div>
          </div>
          <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); openUserProfileModal('${user.id}')">Профиль</button>
        `;
        container.appendChild(div);
      });
    }

    // --- ДРУЗЬЯ ---
    async function loadFriendsAndRequests() {
      const { data: requests } = await db.from('friendships')
        .select('id, sender_id, profiles!friendships_sender_id_fkey(*)')
        .eq('receiver_id', currentUser.id)
        .eq('status', 'pending');

      const reqBox = document.getElementById('incoming-requests');
      reqBox.innerHTML = '';

      if (!requests || requests.length === 0) {
        reqBox.innerHTML = '<p style="color:var(--subtext);font-size:12px;">Нет новых заявок</p>';
      } else {
        requests.forEach(r => {
          const u = r.profiles;
          const div = document.createElement('div');
          div.className = 'user-card';
          div.onclick = () => openUserProfileModal(u.id);
          div.innerHTML = `
            <div class="user-info-block">
              <div class="avatar-img">${u.avatar_url ? `<img src="${u.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : u.username.charAt(0).toUpperCase()}</div>
              <div><b>${escapeHtml(u.full_name || u.username)}</b></div>
            </div>
            <div style="display:flex;gap:4px;" onclick="event.stopPropagation()">
              <button class="btn btn-sm btn-secondary" onclick="respondFriendship(${r.id}, 'accepted')">✓</button>
              <button class="btn btn-sm btn-danger" onclick="respondFriendship(${r.id}, 'rejected')">✕</button>
            </div>
          `;
          reqBox.appendChild(div);
        });
      }

      const { data: friends } = await db.from('friendships')
        .select('id, sender_id, receiver_id, sender:profiles!friendships_sender_id_fkey(*), receiver:profiles!friendships_receiver_id_fkey(*)')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');

      const friendsBox = document.getElementById('friends-list');
      friendsBox.innerHTML = '';

      if (!friends || friends.length === 0) {
        friendsBox.innerHTML = '<p style="color:var(--subtext);font-size:12px;">Список друзей пуст</p>';
      } else {
        friends.forEach(f => {
          const friendProfile = f.sender_id === currentUser.id ? f.receiver : f.sender;
          const div = document.createElement('div');
          div.className = 'user-card';
          div.onclick = () => openUserProfileModal(friendProfile.id);
          div.innerHTML = `
            <div class="user-info-block">
              <div class="avatar-img">${friendProfile.avatar_url ? `<img src="${friendProfile.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : friendProfile.username.charAt(0).toUpperCase()}</div>
              <div>
                <b>${escapeHtml(friendProfile.full_name || friendProfile.username)}</b>
              </div>
            </div>
            <button class="btn btn-sm" onclick="event.stopPropagation(); openDmWith('${friendProfile.id}', '${escapeHtml(friendProfile.full_name || friendProfile.username)}')">💬 Чат</button>
          `;
          friendsBox.appendChild(div);
        });
      }
    }

    async function respondFriendship(friendshipId, status) {
      if (status === 'accepted') {
        await db.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId);
      } else {
        await db.from('friendships').delete().eq('id', friendshipId);
      }
      loadFriendsAndRequests();
    }

    // --- ЧАТЫ И ЛИЧНЫЕ СООБЩЕНИЯ ---
    async function loadChatsList() {
      const { data: friends } = await db.from('friendships')
        .select('id, sender_id, receiver_id, sender:profiles!friendships_sender_id_fkey(*), receiver:profiles!friendships_receiver_id_fkey(*)')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');

      const container = document.getElementById('chats-friends-list');
      container.innerHTML = '';

      if (!friends || friends.length === 0) {
        container.innerHTML = '<p style="color:var(--subtext); font-size:13px; text-align:center; margin-top:20px;">Найдите друзей через поиск, чтобы начать общение!</p>';
        return;
      }

      friends.forEach(f => {
        const friend = f.sender_id === currentUser.id ? f.receiver : f.sender;
        const div = document.createElement('div');
        div.className = 'user-card';
        div.onclick = () => openDmWith(friend.id, friend.full_name || friend.username);
        div.innerHTML = `
          <div class="user-info-block">
            <div class="avatar-img">${friend.avatar_url ? `<img src="${friend.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : friend.username.charAt(0).toUpperCase()}</div>
            <div>
              <b>${escapeHtml(friend.full_name || friend.username)}</b>
              <p style="font-size:11px; color:var(--subtext);">Нажмите, чтобы открыть диалог</p>
            </div>
          </div>
          <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); openUserProfileModal('${friend.id}')">👤</button>
        `;
        container.appendChild(div);
      });
    }

    function openDmWith(friendId, friendName) {
      activeDmPartner = { id: friendId, name: friendName };
      document.getElementById('chats-list-screen').classList.add('hidden');
      document.getElementById('active-chat-screen').classList.remove('hidden');
      document.getElementById('active-partner-name').innerText = friendName;
      
      switchView('chats', document.querySelectorAll('.nav-item')[0], '💬 ' + friendName);
      loadDmMessages();
    }

    function closeActiveChat() {
      activeDmPartner = null;
      document.getElementById('chats-list-screen').classList.remove('hidden');
      document.getElementById('active-chat-screen').classList.add('hidden');
      document.getElementById('header-title').innerText = '💬 Чаты';
    }

    async function loadDmMessages() {
      if (!activeDmPartner) return;
      const { data } = await db.from('direct_messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeDmPartner.id}),and(sender_id.eq.${activeDmPartner.id},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      const box = document.getElementById('dm-chat-box');
      box.innerHTML = '';
      if (data) {
        data.forEach(msg => {
          const isMy = msg.sender_id === currentUser.id;
          const div = document.createElement('div');
          div.className = `msg-group ${isMy ? 'my' : 'their'}`;
          div.innerHTML = `
            <div class="msg-meta">${isMy ? 'Вы' : activeDmPartner.name}</div>
            <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          `;
          box.appendChild(div);
        });
      }
      box.scrollTop = box.scrollHeight;
    }

    async function sendDmMessage() {
      const input = document.getElementById('dm-message-input');
      const text = input.value.trim();
      if (!text || !activeDmPartner) return;
      input.value = '';

      await db.from('direct_messages').insert([{
        sender_id: currentUser.id,
        receiver_id: activeDmPartner.id,
        content: text
      }]);

      loadDmMessages();
    }

    async function clearDmHistory() {
      if (!activeDmPartner || !confirm('Очистить историю этого диалога?')) return;
      await db.from('direct_messages')
        .delete()
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeDmPartner.id}),and(sender_id.eq.${activeDmPartner.id},receiver_id.eq.${currentUser.id})`);
      loadDmMessages();
    }

    function subscribeRealtime() {
      db.channel('realtime_direct_messages')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'direct_messages' }, () => {
          if (activeDmPartner) loadDmMessages();
        })
        .subscribe();
    }

    // --- НАСТРОЙКИ ---
    function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }
  </script>
</body>
</html>
