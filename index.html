<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Групповой Чат</title>
  <!-- Подключаем Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #e9ecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    h2 { font-size: 20px; margin-bottom: 15px; color: #1c1e21; text-align: center; }
    input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 15px; outline: none; }
    input:focus { border-color: #1877f2; }
    button { width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #1877f2; color: white; }
    .btn-primary:hover { background: #166fe5; }
    .hidden { display: none !important; }
    
    #chat-box { height: 350px; border: 1px solid #e4e6eb; border-radius: 8px; overflow-y: auto; padding: 12px; margin-top: 12px; background: #f7f8fa; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 9px 14px; border-radius: 12px; max-width: 80%; font-size: 14px; word-break: break-word; line-height: 1.4; }
    .msg.my { background: #0084ff; color: white; align-self: flex-end; }
    .msg.their { background: #e4e6eb; color: #050505; align-self: flex-start; }
    .msg-author { font-size: 11px; opacity: 0.7; margin-bottom: 3px; font-weight: bold; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  </style>
</head>
<body>

  <!-- Экран ввода Имени -->
  <div id="name-section" class="card">
    <h2>Введите ваше имя</h2>
    <input type="text" id="username-input" placeholder="Например: Билол">
    <button class="btn-primary" onclick="enterChat()">Войти в чат 💬</button>
  </div>

  <!-- Общий Чат -->
  <div id="chat-section" class="card hidden">
    <div class="header-bar">
      <span>👥 <b>Общий чат группы</b></span>
      <small id="user-display" style="color: #1877f2; cursor: pointer;" onclick="changeName()">Сменить имя</small>
    </div>

    <div id="chat-box"></div>

    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" style="margin-top: 0;">
      <button class="btn-primary" style="width: auto; padding: 0 20px; margin-top: 0;" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgnmaoybgwesqctysveu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TSFvhqldPDdWGncB92rVag_KkdkwlZP";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = localStorage.getItem('chat_username') || '';

    // Авто-вход, если имя уже вводили
    if (myName) {
      startChat();
    }

    function enterChat() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('Пожалуйста, введите ваше имя!');
      myName = name;
      localStorage.setItem('chat_username', myName);
      startChat();
    }

    function changeName() {
      localStorage.removeItem('chat_username');
      location.reload();
    }

    function startChat() {
      document.getElementById('name-section').classList.add('hidden');
      document.getElementById('chat-section').classList.remove('hidden');
      document.getElementById('user-display').innerText = '👤 ' + myName;

      loadMessages();
      subscribeToRealtime();
    }

    // Загрузить предыдущие сообщения
    async function loadMessages() {
      const { data } = await db
        .from('group_messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(100);

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      if (data) {
        data.forEach(msg => renderMessage(msg));
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Отрисовка сообщения
    function renderMessage(msg) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      const isMy = msg.username === myName;
      
      div.className = `msg ${isMy ? 'my' : 'their'}`;
      div.innerHTML = `
        <div class="msg-author">${isMy ? 'Вы' : msg.username}</div>
        <div>${escapeHtml(msg.content)}</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Отправить сообщение
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      await db.from('group_messages').insert([{
        username: myName,
        content: text
      }]);
    }

    // Подписка на новые сообщения в реальном времени
    function subscribeToRealtime() {
      db.channel('public:group_messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'group_messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
