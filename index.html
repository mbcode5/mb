<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Social Chat Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --text: #050505;
      --subtext: #65676b;
      --border: #e4e6eb;
      --input-bg: #f0f2f5;
      --primary: #1877f2;
      --primary-hover: #166fe5;
      --msg-my: #1877f2;
      --msg-my-text: #ffffff;
      --msg-their: #e4e6eb;
      --msg-their-text: #050505;
      --shadow: 0 12px 28px rgba(0,0,0,0.1);
      --modal-bg: rgba(0, 0, 0, 0.5);
    }

    [data-theme="dark"] {
      --bg: #18191a;
      --surface: #242526;
      --text: #e4e6eb;
      --subtext: #b0b3b8;
      --border: #393a3b;
      --input-bg: #3a3b3c;
      --primary: #2374e1;
      --primary-hover: #3982e8;
      --msg-my: #2374e1;
      --msg-my-text: #ffffff;
      --msg-their: #3a3b3c;
      --msg-their-text: #e4e6eb;
      --shadow: 0 12px 28px rgba(0,0,0,0.4);
      --modal-bg: rgba(0, 0, 0, 0.75);
    }

    [data-theme="matrix"] {
      --bg: #000000;
      --surface: #051105;
      --text: #00ff66;
      --subtext: #009933;
      --border: #003311;
      --input-bg: #001a08;
      --primary: #00ff66;
      --primary-hover: #33ff88;
      --msg-my: #00441b;
      --msg-my-text: #00ff66;
      --msg-their: #001a08;
      --msg-their-text: #00ff66;
      --shadow: 0 0 20px rgba(0,255,102,0.15);
      --modal-bg: rgba(0, 20, 0, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.2s, color 0.2s; }
    body, html { height: 100%; width: 100%; background-color: var(--bg); color: var(--text); overflow: hidden; }

    /* Полноэкранный контейнер */
    .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; max-width: 900px; margin: 0 auto; background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

    /* Панель Навигации */
    .nav-bar { display: flex; justify-content: space-around; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 0; }
    .nav-item { background: transparent; border: none; color: var(--subtext); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: var(--primary); background: var(--input-bg); }

    /* Вкладки Контента */
    .view-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
    .view-content.active { display: flex; flex-direction: column; }

    /* Чат */
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); border-radius: 12px; }
    .msg-group { display: flex; flex-direction: column; max-width: 75%; }
    .msg-group.my { align-self: flex-end; align-items: flex-end; }
    .msg-group.their { align-self: flex-start; align-items: flex-start; }
    .msg-meta { font-size: 11px; color: var(--subtext); margin-bottom: 3px; font-weight: 600; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg-group.my .msg-bubble { background: var(--msg-my); color: var(--msg-my-text); border-bottom-right-radius: 4px; }
    .msg-group.their .msg-bubble { background: var(--msg-their); color: var(--msg-their-text); border-bottom-left-radius: 4px; }

    .input-bar { padding: 12px 0 0 0; display: flex; gap: 10px; }
    .input-bar input, .custom-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); outline: none; font-size: 14px; }
    
    .btn { padding: 10px 18px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; background: var(--primary); color: white; }
    .btn-secondary { background: #10b981; }
    .btn-danger { background: #ef4444; }

    /* Карточка Профиля и Карточки Поиска */
    .user-card { display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 14px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
    .user-info-block { display: flex; align-items: center; gap: 12px; }
    .avatar-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }

    /* Модальное окно */
    .modal-backdrop { position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--surface); padding: 24px; border-radius: 20px; width: 100%; max-width: 420px; border: 1px solid var(--border); box-shadow: var(--shadow); }

    .hidden { display: none !important; }
    .auth-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
    .auth-card { background: var(--surface); padding: 32px; border-radius: 20px; width: 100%; max-width: 380px; border: 1px solid var(--border); box-shadow: var(--shadow); }
  </style>
</head>
<body>

  <!-- Экран Входа / Регистрации -->
  <div id="auth-section" class="auth-overlay">
    <div class="auth-card">
      <h2 style="text-align: center; margin-bottom: 12px;">Facebook Lite</h2>
      <div style="display: flex; gap: 6px; margin-bottom: 16px;">
        <button id="tab-login-btn" class="btn" style="flex:1;" onclick="switchAuthTab('login')">Вход</button>
        <button id="tab-reg-btn" class="btn" style="flex:1; background: var(--input-bg); color: var(--text);" onclick="switchAuthTab('reg')">Регистрация</button>
      </div>

      <div id="login-form">
        <input type="email" id="login-email" class="custom-input" placeholder="Email" style="width: 100%; margin-bottom: 10px;">
        <input type="password" id="login-password" class="custom-input" placeholder="Пароль" style="width: 100%; margin-bottom: 10px;">
        <button class="btn" style="width: 100%;" onclick="login()">Войти</button>
      </div>

      <div id="reg-form" class="hidden">
        <input type="text" id="reg-username" class="custom-input" placeholder="Никнейм / Имя" style="width: 100%; margin-bottom: 10px;">
        <input type="email" id="reg-email" class="custom-input" placeholder="Email" style="width: 100%; margin-bottom: 10px;">
        <input type="password" id="reg-password" class="custom-input" placeholder="Пароль (мин. 6)" style="width: 100%; margin-bottom: 10px;">
        <button class="btn btn-secondary" style="width: 100%;" onclick="register()">Создать аккаунт</button>
      </div>
    </div>
  </div>

  <!-- Главный Полноэкранный Интерфейс -->
  <div id="app-section" class="app-container hidden">
    <!-- Шапка Навигации -->
    <div class="nav-bar">
      <button class="nav-item active" onclick="switchView('chat', this)">💬<span>Чат</span></button>
      <button class="nav-item" onclick="switchView('search', this)">🔍<span>Поиск</span></button>
      <button class="nav-item" onclick="switchView('friends', this)">👥<span>Друзья</span></button>
      <button class="nav-item" onclick="switchView('profile', this)">👤<span>Профиль</span></button>
      <button class="nav-item" onclick="openSettings()">⚙️<span>Опции</span></button>
    </div>

    <!-- Вкладка 1: ЧАТ -->
    <div id="view-chat" class="view-content active">
      <div id="chat-box" class="chat-messages"></div>
      <div class="input-bar">
        <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <!-- Вкладка 2: ПОИСК ПОЛЬЗОВАТЕЛЕЙ -->
    <div id="view-search" class="view-content">
      <h3 style="margin-bottom: 12px;">Поиск людей</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="search-input" class="custom-input" placeholder="Введите имя или никнейм..." onkeydown="if(event.key==='Enter') searchUsers()">
        <button class="btn" onclick="searchUsers()">Искать</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Вкладка 3: ДРУЗЬЯ И ЗАЯВКИ -->
    <div id="view-friends" class="view-content">
      <h3 style="margin-bottom: 10px;">Входящие заявки</h3>
      <div id="incoming-requests" style="margin-bottom: 24px;"></div>

      <h3 style="margin-bottom: 10px;">Мои друзья</h3>
      <div id="friends-list"></div>
    </div>

    <!-- Вкладка 4: ПРОФИЛЬ -->
    <div id="view-profile" class="view-content">
      <div style="text-align: center; margin-bottom: 20px;">
        <div id="profile-avatar-display" class="avatar-img" style="width: 90px; height: 90px; font-size: 36px; margin: 0 auto 12px auto;">?</div>
        <h2 id="profile-name-display">Имя Фамилия</h2>
        <p id="profile-bio-display" style="color: var(--subtext); font-size: 14px; margin-top: 4px;">---</p>
      </div>

      <div style="background: var(--input-bg); padding: 16px; border-radius: 12px;">
        <h4 style="margin-bottom: 10px;">Редактировать профиль</h4>
        <input type="text" id="edit-fullname" class="custom-input" placeholder="Полное Имя" style="width: 100%; margin-bottom: 10px;">
        <input type="text" id="edit-avatar" class="custom-input" placeholder="Ссылка на фото аватара (URL)" style="width: 100%; margin-bottom: 10px;">
        <textarea id="edit-bio" class="custom-input" placeholder="О себе..." style="width: 100%; height: 70px; margin-bottom: 10px;"></textarea>
        <button class="btn" style="width: 100%;" onclick="saveProfile()">Сохранить изменения</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно Настроек -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3>⚙️ Настройки</h3>
        <button class="btn" onclick="closeSettings()" style="padding: 4px 10px;">✕</button>
      </div>
      <button class="btn" onclick="toggleTheme()" style="width: 100%; margin-bottom: 10px;">☀️ / 🌙 Сменить тему</button>
      
      <details style="margin-bottom: 16px;">
        <summary style="cursor: pointer; color: var(--subtext); font-size: 13px;">🔒 Секретный консольный режим</summary>
        <div style="margin-top: 8px;">
          <input type="text" id="cheat-code-input" class="custom-input" placeholder="Введите чит-код..." style="width: 100%; margin-bottom: 6px;">
          <button class="btn" style="width: 100%;" onclick="applyCheatCode()">Применить</button>
        </div>
      </details>

      <button class="btn btn-danger" style="width: 100%;" onclick="logout()">🚪 Выйти из аккаунта</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgnmaoybgwesqctysveu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TSFvhqldPDdWGncB92rVag_KkdkwlZP";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let myProfileData = null;

    // --- Управление Темой ---
    let currentTheme = localStorage.getItem('chat_theme') || 'light';
    applyTheme(currentTheme);

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('chat_theme', theme);
      currentTheme = theme;
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    }

    // --- Состояние Авторизации ---
    db.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        showApp();
      } else {
        currentUser = null;
        showAuth();
      }
    });

    function switchAuthTab(type) {
      if (type === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('reg-form').classList.add('hidden');
      } else {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('reg-form').classList.remove('hidden');
      }
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!email || !password) return alert('Заполните все поля!');
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) alert('Ошибка входа: ' + error.message);
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      if (!username || !email || !password) return alert('Заполните все поля!');

      const { error } = await db.auth.signUp({
        email, password, options: { data: { username: username } }
      });

      if (error) return alert('Ошибка регистрации: ' + error.message);
      await db.auth.signInWithPassword({ email, password });
    }

    async function logout() {
      closeSettings();
      await db.auth.signOut();
    }

    function showApp() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      loadMyProfile();
      loadMessages();
      subscribeRealtime();
    }

    function showAuth() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
    }

    // --- Переключение Вкладок ---
    function switchView(viewName, btn) {
      document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`view-${viewName}`).classList.add('active');
      if (btn) btn.classList.add('active');

      if (viewName === 'friends') loadFriendsAndRequests();
    }

    // --- ПРОФИЛЬ ---
    async function loadMyProfile() {
      let { data, error } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
      
      if (!data) {
        // Если профиль не создался автоматически
        const defaultName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        await db.from('profiles').insert([{ id: currentUser.id, username: defaultName, full_name: defaultName }]);
        data = { id: currentUser.id, username: defaultName, full_name: defaultName };
      }

      myProfileData = data;
      document.getElementById('profile-name-display').innerText = data.full_name || data.username;
      document.getElementById('profile-bio-display').innerText = data.bio || 'Нет описания';
      
      const avatarBox = document.getElementById('profile-avatar-display');
      if (data.avatar_url) {
        avatarBox.innerHTML = `<img src="${data.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarBox.innerText = (data.full_name || data.username).charAt(0).toUpperCase();
      }

      document.getElementById('edit-fullname').value = data.full_name || '';
      document.getElementById('edit-avatar').value = data.avatar_url || '';
      document.getElementById('edit-bio').value = data.bio || '';
    }

    async function saveProfile() {
      const full_name = document.getElementById('edit-fullname').value.trim();
      const avatar_url = document.getElementById('edit-avatar').value.trim();
      const bio = document.getElementById('edit-bio').value.trim();

      const { error } = await db.from('profiles').update({ full_name, avatar_url, bio }).eq('id', currentUser.id);

      if (error) alert('Ошибка сохранения: ' + error.message);
      else {
        alert('Профиль обновлен!');
        loadMyProfile();
      }
    }

    // --- ПОИСК И ДОБАВЛЕНИЕ В ДРУЗЬЯ ---
    async function searchUsers() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      const { data, error } = await db.from('profiles')
        .select('*')
        .ilike('username', `%${query}%`)
        .neq('id', currentUser.id);

      const container = document.getElementById('search-results');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:var(--subtext);">Никого не найдено</p>';
        return;
      }

      data.forEach(user => {
        const div = document.createElement('div');
        div.className = 'user-card';
        div.innerHTML = `
          <div class="user-info-block">
            <div class="avatar-img">${user.avatar_url ? `<img src="${user.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : user.username.charAt(0).toUpperCase()}</div>
            <div>
              <b>${escapeHtml(user.full_name || user.username)}</b>
              <p style="font-size:12px;color:var(--subtext);">@${escapeHtml(user.username)}</p>
            </div>
          </div>
          <button class="btn" style="font-size:12px;" onclick="sendFriendRequest('${user.id}', this)">+ В друзья</button>
        `;
        container.appendChild(div);
      });
    }

    async function sendFriendRequest(receiverId, btn) {
      const { error } = await db.from('friendships').insert([{
        sender_id: currentUser.id,
        receiver_id: receiverId,
        status: 'pending'
      }]);

      if (error) {
        alert('Заявка уже отправлена или произошла ошибка!');
      } else {
        btn.innerText = 'Заявка отправлена';
        btn.disabled = true;
        btn.style.opacity = '0.6';
      }
    }

    // --- ДРУЗЬЯ И ВХОДЯЩИЕ ЗАЯВКИ ---
    async function loadFriendsAndRequests() {
      // 1. Загрузка входящих заявок
      const { data: requests } = await db.from('friendships')
        .select('id, sender_id, profiles!friendships_sender_id_fkey(*)')
        .eq('receiver_id', currentUser.id)
        .eq('status', 'pending');

      const reqBox = document.getElementById('incoming-requests');
      reqBox.innerHTML = '';

      if (!requests || requests.length === 0) {
        reqBox.innerHTML = '<p style="color:var(--subtext);font-size:13px;">Нет новых заявок</p>';
      } else {
        requests.forEach(r => {
          const u = r.profiles;
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `
            <div class="user-info-block">
              <div class="avatar-img">${u.avatar_url ? `<img src="${u.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : u.username.charAt(0).toUpperCase()}</div>
              <div><b>${escapeHtml(u.full_name || u.username)}</b></div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="respondFriendship(${r.id}, 'accepted')">Принять</button>
              <button class="btn btn-danger" style="padding:6px 12px;font-size:12px;" onclick="respondFriendship(${r.id}, 'rejected')">Отклонить</button>
            </div>
          `;
          reqBox.appendChild(div);
        });
      }

      // 2. Загрузка списка друзей
      const { data: friends } = await db.from('friendships')
        .select('id, sender_id, receiver_id, sender:profiles!friendships_sender_id_fkey(*), receiver:profiles!friendships_receiver_id_fkey(*)')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');

      const friendsBox = document.getElementById('friends-list');
      friendsBox.innerHTML = '';

      if (!friends || friends.length === 0) {
        friendsBox.innerHTML = '<p style="color:var(--subtext);font-size:13px;">У вас пока нет друзей</p>';
      } else {
        friends.forEach(f => {
          const friendProfile = f.sender_id === currentUser.id ? f.receiver : f.sender;
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `
            <div class="user-info-block">
              <div class="avatar-img">${friendProfile.avatar_url ? `<img src="${friendProfile.avatar_url}" style="width:100%;height:100%;border-radius:50%;">` : friendProfile.username.charAt(0).toUpperCase()}</div>
              <div>
                <b>${escapeHtml(friendProfile.full_name || friendProfile.username)}</b>
                <p style="font-size:11px;color:var(--subtext);">${escapeHtml(friendProfile.bio || 'В сети')}</p>
              </div>
            </div>
          `;
          friendsBox.appendChild(div);
        });
      }
    }

    async function respondFriendship(friendshipId, status) {
      if (status === 'accepted') {
        await db.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId);
      } else {
        await db.from('friendships').delete().eq('id', friendshipId);
      }
      loadFriendsAndRequests();
    }

    // --- ЧАТ И СООБЩЕНИЯ ---
    async function loadMessages() {
      const { data } = await db.from('group_messages').select('*').order('created_at', { ascending: true }).limit(100);
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      if (data) data.forEach(msg => renderMessage(msg));
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderMessage(msg) {
      const chatBox = document.getElementById('chat-box');
      const myName = myProfileData?.username || currentUser?.email.split('@')[0];
      const isMy = msg.username === myName;

      const div = document.createElement('div');
      div.className = `msg-group ${isMy ? 'my' : 'their'}`;
      div.innerHTML = `
        <div class="msg-meta">${isMy ? 'Вы' : escapeHtml(msg.username)}</div>
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const myName = myProfileData?.full_name || myProfileData?.username || currentUser.email.split('@')[0];
      input.value = '';

      await db.from('group_messages').insert([{ username: myName, content: text }]);
    }

    function subscribeRealtime() {
      db.channel('public_chats')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'group_messages' }, () => loadMessages())
        .subscribe();
    }

    // --- НАСТРОЙКИ И ЧИТ-КОДЫ ---
    function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

    async function applyCheatCode() {
      const input = document.getElementById('cheat-code-input');
      const code = input.value.trim();

      if (code === '#delete_all') {
        if (confirm('Удалить всю историю сообщений для всех?')) {
          await db.from('group_messages').delete().gte('id', 0);
          closeSettings();
        }
      } else if (code === '#matrix') {
        applyTheme('matrix');
        closeSettings();
      } else {
        alert('❌ Неизвестный код');
      }
      input.value = '';
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }
  </script>
</body>
</html>
