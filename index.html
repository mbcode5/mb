<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Групповой Чат с Авторизацией</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #e9ecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    h2 { font-size: 20px; margin-bottom: 15px; color: #1c1e21; text-align: center; }
    input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 15px; outline: none; }
    input:focus { border-color: #1877f2; }
    button { width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #1877f2; color: white; }
    .btn-primary:hover { background: #166fe5; }
    .btn-secondary { background: #42b72a; color: white; }
    .btn-secondary:hover { background: #36a420; }
    .btn-danger { background: #dc3545; color: white; font-size: 12px; padding: 6px 12px; width: auto; margin: 0; }
    .btn-danger:hover { background: #bd2130; }
    .hidden { display: none !important; }
    
    #chat-box { height: 350px; border: 1px solid #e4e6eb; border-radius: 8px; overflow-y: auto; padding: 12px; margin-top: 12px; background: #f7f8fa; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 9px 14px; border-radius: 12px; max-width: 80%; font-size: 14px; word-break: break-word; line-height: 1.4; }
    .msg.my { background: #0084ff; color: white; align-self: flex-end; }
    .msg.their { background: #e4e6eb; color: #050505; align-self: flex-start; }
    .msg-author { font-size: 11px; opacity: 0.7; margin-bottom: 3px; font-weight: bold; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  </style>
</head>
<body>

  <!-- Форма Регистрации / Входа -->
  <div id="auth-section" class="card">
    <h2>Вход / Регистрация</h2>
    <input type="text" id="reg-username" placeholder="Имя / Никнейм (например: Билол)">
    <input type="email" id="reg-email" placeholder="Email (например: user@mail.ru)">
    <input type="password" id="reg-password" placeholder="Пароль (минимум 6 символов)">
    <button class="btn-primary" onclick="register()">Зарегистрироваться</button>
    <button class="btn-secondary" onclick="login()">Войти в аккаунт</button>
  </div>

  <!-- Главный экран Чата -->
  <div id="chat-section" class="card hidden">
    <div class="header-bar">
      <span>👥 <b>Общий чат</b> (<span id="user-display" style="color: #1877f2;"></span>)</span>
      <button class="btn-danger" onclick="logout()">Выйти 🚪</button>
    </div>

    <div id="chat-box"></div>

    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" style="margin-top: 0;">
      <button class="btn-primary" style="width: auto; padding: 0 20px; margin-top: 0;" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgnmaoybgwesqctysveu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TSFvhqldPDdWGncB92rVag_KkdkwlZP";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // Отслеживание состояния входа
    db.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        showChat();
      } else {
        currentUser = null;
        showAuth();
      }
    });

    // Регистрация
    async function register() {
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const username = document.getElementById('reg-username').value.trim();

      if (!username || !email || !password) return alert('Заполните все поля!');

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: { data: { username: username } }
      });

      if (error) return alert('Ошибка регистрации: ' + error.message);

      // Автоматический вход после регистрации
      const { error: loginError } = await db.auth.signInWithPassword({ email, password });
      if (loginError) alert('Регистрация успешна! Теперь воспользуйтесь кнопкой "Войти".');
    }

    // Вход
    async function login() {
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      if (!email || !password) return alert('Введите Email и Пароль!');

      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) alert('Ошибка входа: ' + error.message);
    }

    // Выход
    async function logout() {
      await db.auth.signOut();
    }

    // Отобразить Чат
    function showChat() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('chat-section').classList.remove('hidden');

      const myName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
      document.getElementById('user-display').innerText = myName;

      loadMessages();
      subscribeToRealtime();
    }

    // Отобразить Форму Входа
    function showAuth() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('chat-section').classList.add('hidden');
    }

    // Загрузить сообщения
    async function loadMessages() {
      const { data, error } = await db
        .from('group_messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(100);

      if (error) return console.error('Ошибка загрузки:', error.message);

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      if (data) {
        data.forEach(msg => renderMessage(msg));
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Отрисовка сообщения
    function renderMessage(msg) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      
      const myName = currentUser?.user_metadata?.username || currentUser?.email.split('@')[0];
      const isMy = msg.username === myName;
      
      div.className = `msg ${isMy ? 'my' : 'their'}`;
      div.innerHTML = `
        <div class="msg-author">${isMy ? 'Вы' : escapeHtml(msg.username)}</div>
        <div>${escapeHtml(msg.content)}</div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Отправить сообщение
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const myName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
      input.value = '';

      const { error } = await db.from('group_messages').insert([{
        username: myName,
        content: text
      }]);

      if (error) {
        alert('Ошибка отправки: ' + error.message);
      } else {
        loadMessages();
      }
    }

    // Подписка Realtime
    function subscribeToRealtime() {
      db.channel('public:group_messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'group_messages' }, () => {
          loadMessages();
        })
        .subscribe();
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
