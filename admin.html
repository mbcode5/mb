<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB — Модерация</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:-apple-system,Arial,sans-serif;background:#000;color:#fff;padding:16px;max-width:760px;margin:auto}.c{border:1px solid #292929;border-radius:6px;padding:14px;margin-bottom:10px;background:#090909}button,input{border:1px solid #292929;background:#111;color:#fff;border-radius:5px;padding:9px 14px;margin:8px 8px 0 0;font:inherit}button{cursor:pointer}.d{border-color:#e5383b;color:#e5383b}.on{background:#fff;color:#000}img{max-width:100%;border-radius:5px;margin-top:8px}a{color:#fff}small{color:#777}.st{display:flex;gap:8px}.st .c{flex:1;text-align:center;font-size:22px}</style></head><body>
<h2>Модерация MB</h2><p><a href="./">← В приложение</a></p>
<div><button id="t1" onclick="tab(1)">Жалобы</button><button id="t2" onclick="tab(2)">Пользователи</button><button id="t3" onclick="tab(3)">Статистика</button></div>
<div id="box">Загрузка...</div>
<script>
const db=supabase.createClient("https://pgnmaoybgwesqctysveu.supabase.co","sb_publishable_TSFvhqldPDdWGncB92rVag_KkdkwlZP");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const box=document.getElementById("box");let T=1;
function tab(n){T=n;[1,2,3].forEach(i=>document.getElementById("t"+i).classList.toggle("on",i==n));({1:reports,2:users,3:stats})[n]()}
async function init(){const {data:{session}}=await db.auth.getSession();
 if(!session){box.textContent="Войдите в MB в этом же браузере.";return}
 const {data:me}=await db.from("profiles").select("is_admin").eq("id",session.user.id).single();
 if(!me?.is_admin){box.textContent="Нет доступа: вы не модератор.";return}
 tab(1)}
async function reports(){
 box.textContent="Загрузка...";
 const {data:r,error}=await db.from("reports").select("*").limit(100);
 if(error){box.textContent=error.message;return}
 if(!r.length){box.textContent="Жалоб нет.";return}
 const {data:ps}=await db.from("posts").select("*").in("id",[...new Set(r.map(x=>x.post_id))]);
 const P=Object.fromEntries((ps||[]).map(p=>[p.id,p]));
 box.innerHTML=r.map(x=>{const p=P[x.post_id],im=p&&(p.image_urls?.[0]||p.image_url);
  return `<div class="c"><small>Причина:</small> ${esc(x.reason)}<hr style="border:0;border-top:1px solid #292929">${p?`${esc(p.content||"")}${im?`<img src="${esc(im)}">`:""}<br><button class="d" onclick="delPost('${p.id}')">Удалить пост</button><button class="d" onclick="ban('${p.user_id}',true)">Заблокировать автора</button>`:"<small>Пост уже удалён</small><br>"}<button onclick="dismiss('${x.id}')">Отклонить жалобу</button></div>`}).join("")}
async function delPost(id){if(!confirm("Удалить пост?"))return;const {error}=await db.from("posts").delete().eq("id",id);if(error)return alert(error.message);reports()}
async function dismiss(id){await db.from("reports").delete().eq("id",id);reports()}
async function ban(id,v){if(v&&!confirm("Заблокировать пользователя? Он не сможет войти."))return;const {error}=await db.from("profiles").update({is_banned:v}).eq("id",id);if(error)return alert(error.message);T==2?users():alert(v?"Заблокирован":"Разблокирован")}
async function verify(id,v){const {error}=await db.from("profiles").update({is_verified:v}).eq("id",id);if(error)return alert(error.message);users()}
async function users(){
 box.innerHTML=`<input id="q" placeholder="Имя или username" style="width:60%"><button onclick="users()">Найти</button><div id="ul"></div>`;
 const q=(document.getElementById("q").value||"").trim();
 let r=db.from("profiles").select("*").order("created_at",{ascending:false}).limit(50);
 if(q)r=r.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);
 const {data,error}=await r;const ul=document.getElementById("ul");
 if(error){ul.textContent=error.message;return}
 ul.innerHTML=data.map(u=>`<div class="c"><b>${esc(u.full_name||"")}</b> @${esc(u.username)}${u.is_verified?" ✔":""}${u.is_banned?" 🚫":""}${u.is_private?" 🔒":""}<br><button onclick="verify('${u.id}',${!u.is_verified})">${u.is_verified?"Снять галочку":"Подтвердить ✔"}</button><button class="d" onclick="ban('${u.id}',${!u.is_banned})">${u.is_banned?"Разблокировать":"Заблокировать"}</button></div>`).join("")}
async function stats(){
 const n=async t=>(await db.from(t).select("*",{count:"exact",head:true})).count??0;
 const [a,b,c,d]=await Promise.all([n("profiles"),n("posts"),n("comments"),n("reports")]);
 box.innerHTML=`<div class="st"><div class="c">${a}<br><small>людей</small></div><div class="c">${b}<br><small>постов</small></div><div class="c">${c}<br><small>комментариев</small></div><div class="c">${d}<br><small>жалоб</small></div></div>`}
init();
</script></body></html>
